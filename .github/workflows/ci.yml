name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Type check + build
        run: npm run build

      - name: Unit tests
        run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>零 · 组装式变身 v2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; background:#0e0e18; color:#eaeaea; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:30px; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:#888; font-size:13px; margin-bottom:22px; }

  .stage { width:460px; height:460px; background:radial-gradient(circle at 50% 40%, #1a1a30, #0a0a14); border-radius:20px; border:1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  svg { display:block; }
  .controls { display:flex; gap:14px; margin-top:22px; align-items:center; }
  .btn { padding:12px 30px; border-radius:12px; border:none; font-size:15px; font-weight:700; cursor:pointer; transition:transform .15s; }
  .btn:hover { transform:scale(1.05); }
  .btn-primary { background:#7dffa8; color:#0e0e18; }
  .btn-ghost { background:rgba(255,255,255,.1); color:#ddd; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .status { margin-top:14px; font-size:13px; color:#888; min-height:22px; text-align:center; }
  .timeline { margin-top:8px; font-size:11px; color:#555; max-width:420px; text-align:center; line-height:1.8; }

  /* ═══════════ 组装式变身 ═══════════ */
  /* 所有赛博部件：初始在画面外，变身时飞入贴合 */
  .cy-part {
    opacity: 0;
    transition: transform .38s cubic-bezier(.2,.75,.25,1.15), opacity .12s ease;
  }
  .cyborg .cy-part { opacity: 1; transform: translate(0,0) rotate(0deg) scale(1) !important; }

  /* 每个部件的飞行起点（从画面外） */
  .fly-leg-l  { transform: translate(-260px, 320px) rotate(140deg) scale(.4); }
  .fly-leg-r  { transform: translate(300px, 340px) rotate(-140deg) scale(.4); }
  .fly-arm-l  { transform: translate(-300px, 120px) rotate(150deg) scale(.35); }
  .fly-arm-r  { transform: translate(340px, 100px) rotate(-150deg) scale(.35); }
  .fly-armor-t{ transform: translate(0px, -260px) rotate(180deg) scale(.5); }
  .fly-armor-b{ transform: translate(0px, 300px) rotate(180deg) scale(.5); }
  .fly-armor-l{ transform: translate(-280px, 0px) rotate(90deg) scale(.5); }
  .fly-armor-r{ transform: translate(300px, 0px) rotate(-90deg) scale(.5); }
  .fly-core   { transform: translate(0px, -280px) scale(.3); }
  .fly-eye    { transform: translate(-280px, -60px) scale(.3); }

  /* 错峰贴合：每个部件不同的 transition-delay */
  .cyborg .d-leg-l  { transition-delay: .45s; }
  .cyborg .d-leg-r  { transition-delay: .55s; }
  .cyborg .d-arm-l  { transition-delay: .75s; }
  .cyborg .d-arm-r  { transition-delay: .85s; }
  .cyborg .d-armor-t{ transition-delay: 1.1s; }
  .cyborg .d-armor-b{ transition-delay: 1.2s; }
  .cyborg .d-armor-l{ transition-delay: 1.3s; }
  .cyborg .d-armor-r{ transition-delay: 1.4s; }
  .cyborg .d-core   { transition-delay: 1.65s; }
  .cyborg .d-eye    { transition-delay: 1.9s; }

  /* 贴合瞬间闪光点 */
  .snap { opacity:0; }
  .cyborg .snap { animation: snap-flash .3s ease forwards; }
  .cyborg .s-leg-l { animation-delay: .45s; } .cyborg .s-leg-r { animation-delay: .55s; }
  .cyborg .s-arm-l { animation-delay: .75s; } .cyborg .s-arm-r { animation-delay: .85s; }
  .cyborg .s-armor-t { animation-delay: 1.1s; } .cyborg .s-armor-b { animation-delay: 1.2s; }
  .cyborg .s-armor-l { animation-delay: 1.3s; } .cyborg .s-armor-r { animation-delay: 1.4s; }
  .cyborg .s-core { animation-delay: 1.65s; } .cyborg .s-eye { animation-delay: 1.9s; }
  @keyframes snap-flash { 0%{opacity:0; transform:scale(.4);} 40%{opacity:1; transform:scale(1.4);} 100%{opacity:0; transform:scale(1.8);} }

  /* Q版部件：变身时收走 */
  .q-part { transition: transform .3s ease, opacity .2s ease; }
  .cyborg .q-body, .cyborg .q-eye, .cyborg .q-mouth { opacity:0; transform: scale(.85); }
  .cyborg .q-leg-l { opacity:0; transform: translateY(30px); }
  .cyborg .q-leg-r { opacity:0; transform: translateY(30px); }
  .cyborg .q-arm-l { opacity:0; transform: rotate(160deg) translate(-10px,-20px); }
  .cyborg .q-arm-r { opacity:0; transform: rotate(-160deg) translate(10px,-20px); }

  /* 特效层 */
  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  .transforming .flash { animation: flash-blink .5s ease .25s 2; }
  @keyframes flash-blink { 0%{opacity:0;} 25%{opacity:.8;} 50%{opacity:0;} 100%{opacity:0;} }

  .eyecharge { position:absolute; width:120px; height:120px; left:50%; top:42%; margin-left:-60px; margin-top:-60px; border-radius:50%; opacity:0; background:radial-gradient(circle, rgba(125,255,168,.6), transparent 70%); }
  .transforming .eyecharge { animation: charge .55s ease .08s forwards; }
  @keyframes charge { 0%{opacity:0; transform:scale(.3);} 60%{opacity:.9;} 100%{opacity:0; transform:scale(1.4);} }

  .shake { animation:none; }
  .transforming .shake { animation: body-shake .4s ease .3s; }
  @keyframes body-shake { 0%,100%{transform:translate(0);} 20%{transform:translate(-3px,1px);} 40%{transform:translate(3px,-1px);} 60%{transform:translate(-2px,-1px);} 80%{transform:translate(2px,1px);} }

  .burst { position:absolute; width:360px; height:360px; border-radius:50%; opacity:0; pointer-events:none; background:radial-gradient(circle, rgba(125,255,168,.5), rgba(125,255,168,.1) 45%, transparent 70%); }
  .transforming .burst { animation: burst-out .6s ease 2.15s forwards; }
  @keyframes burst-out { 0%{opacity:0; transform:scale(.2);} 30%{opacity:1;} 100%{opacity:0; transform:scale(2.5);} }

  .ring { position:absolute; width:220px; height:220px; border:2px solid rgba(125,255,168,.6); border-radius:50%; opacity:0; }
  .transforming .ring { animation: ring-out .7s ease 2.1s forwards; }
  @keyframes ring-out { 0%{opacity:0; transform:scale(.3);} 40%{opacity:.9;} 100%{opacity:0; transform:scale(2);} }

  .spark { position:absolute; width:6px; height:12px; border-radius:2px; background:#7dffa8; opacity:0; }
  .spark.s1 { top:70px; left:70px; --dx:-50px; --dy:-30px; } .spark.s2 { top:100px; right:80px; --dx:45px; --dy:-20px; }
  .spark.s3 { bottom:90px; left:100px; --dx:-35px; --dy:40px; } .spark.s4 { bottom:70px; right:70px; --dx:50px; --dy:30px; }
  .transforming .spark { animation: spark-fly .8s ease 2.25s forwards; }
  .transforming .spark.s2 { animation-delay:2.32s; } .transforming .spark.s3 { animation-delay:2.38s; } .transforming .spark.s4 { animation-delay:2.3s; }
  @keyframes spark-fly { 0%{opacity:1; transform:translate(0,0) rotate(0);} 100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(220deg);} }

  .finish-glow { position:absolute; inset:-30px; background:radial-gradient(circle at 50% 42%, rgba(125,255,168,.25), transparent 60%); opacity:0; pointer-events:none; transition:opacity .6s 2.3s; }
  .cyborg .finish-glow { opacity:.4; }

  /* ═══════════ 反差彩蛋：酷不过三秒 ═══════════ */
  .derp .c-eye path { transition: none; }
  .derp .c-eye .sharp { opacity:0; }
  .derp .c-eye .round { opacity:1; }
  .derp .c-body, .derp .cy-part { animation: sneeze .5s ease; }
  @keyframes sneeze { 0%,100%{transform:translate(0);} 25%{transform:translate(-4px,-2px) rotate(-2deg);} 50%{transform:translate(3px,-3px) rotate(2deg);} 75%{transform:translate(-2px,1px);} }
  .derp-bubble { position:absolute; top:60px; left:calc(50% + 30px); background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); padding:6px 12px; border-radius:14px; font-size:13px; color:#fff; opacity:0; transform:translateY(6px); }
  .derp .derp-bubble { animation: pop-in .35s ease 1.15s forwards; }
  @keyframes pop-in { to { opacity:1; transform:translateY(0);} }

  /* 赛博眼双态：锐利(默认) / 圆(反差时) */
  .round { opacity:0; }
</style>
</head>
<body>

<h1>⬡ 零 · 组装式变身 v2</h1>
<div class="sub">部件从画面外飞来，一件一件贴上身 —— 贴完定格，然后"酷不过三秒"</div>

<div class="stage" id="stage">
  <div class="finish-glow"></div>
  <div class="burst"></div>
  <div class="ring"></div>
  <div class="flash"></div>
  <div class="eyecharge"></div>
  <div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div><div class="spark s4"></div>
  <div class="derp-bubble">阿嚏！…咳。刚才的风有点大。</div>

  <svg width="400" height="400" viewBox="0 0 220 220">
    <defs>
      <linearGradient id="gMetal" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3a4052"/><stop offset=".6" stop-color="#222636"/><stop offset="1" stop-color="#14161f"/>
      </linearGradient>
      <radialGradient id="gCore">
        <stop offset="0" stop-color="#eafff3"/><stop offset=".45" stop-color="#7dffa8"/><stop offset="1" stop-color="#7dffa8" stop-opacity="0"/>
      </radialGradient>
      <filter id="fGlow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <g id="root" class="shake">
      <!-- ════ Q版部件（日常形态） ════ -->
      <g class="q-part">
        <rect class="q-leg-l" x="60" y="118" width="16" height="30" rx="8" fill="#2a2a3e"/>
        <rect class="q-leg-r" x="144" y="118" width="16" height="30" rx="8" fill="#2a2a3e"/>
        <g class="q-arm-l"><rect x="34" y="40" width="14" height="44" rx="7" fill="#2a2a3e"/></g>
        <g class="q-arm-r"><rect x="172" y="40" width="14" height="44" rx="7" fill="#2a2a3e"/></g>
        <rect class="q-body" x="42" y="26" width="136" height="136" rx="42" fill="#1c1c2e" stroke="#7dffa8" stroke-width="3"/>
        <g class="q-eye">
          <ellipse cx="74" cy="72" rx="11" ry="10" fill="#eaeaea"/>
          <ellipse cx="146" cy="72" rx="11" ry="10" fill="#eaeaea"/>
          <circle cx="77" cy="70" r="4" fill="#12121e"/>
          <circle cx="149" cy="70" r="4" fill="#12121e"/>
          <circle cx="80" cy="66" r="1.6" fill="#fff"/>
          <circle cx="152" cy="66" r="1.6" fill="#fff"/>
        </g>
        <path class="q-mouth" d="M98 100 Q110 94 122 100" stroke="#eaeaea" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>

      <!-- ════ 赛博部件（外部飞来组装） ════ -->
      <!-- 底层身体 -->
      <path class="cy-part fly-base" d="M58 32 L162 32 L178 48 L178 146 L162 162 L58 162 L42 146 L42 48 Z"
            fill="url(#gMetal)" stroke="#7dffa8" stroke-width="2" opacity="0" style="transition:opacity .3s ease .3s;"/>
      <g class="cyborg-opacity">
        <!-- 机械腿 -->
        <g class="cy-part fly-leg-l d-leg-l">
          <rect x="66" y="134" width="18" height="14" rx="4" fill="url(#gMetal)" stroke="#4a5064" stroke-width="1.5"/>
          <circle cx="75" cy="150" r="5.5" fill="#262a3a" stroke="#7dffa8" stroke-width="1.2"/>
          <rect x="70" y="154" width="10" height="24" rx="3" fill="url(#gMetal)"/>
          <path d="M64 178 L75 168 L86 178" fill="none" stroke="#7dffa8" stroke-width="1.5"/>
          <circle class="snap s-leg-l" cx="75" cy="150" r="6" fill="none" stroke="#7dffa8" stroke-width="2"/>
        </g>
        <g class="cy-part fly-leg-r d-leg-r">
          <rect x="136" y="134" width="18" height="14" rx="4" fill="url(#gMetal)" stroke="#4a5064" stroke-width="1.5"/>
          <circle cx="145" cy="150" r="5.5" fill="#262a3a" stroke="#7dffa8" stroke-width="1.2"/>
          <rect x="140" y="154" width="10" height="24" rx="3" fill="url(#gMetal)"/>
          <path d="M134 178 L145 168 L156 178" fill="none" stroke="#7dffa8" stroke-width="1.5"/>
          <circle class="snap s-leg-r" cx="145" cy="150" r="6" fill="none" stroke="#7dffa8" stroke-width="2"/>
        </g>
        <!-- 机械臂 -->
        <g class="cy-part fly-arm-l d-arm-l">
          <rect x="26" y="56" width="16" height="44" rx="6" fill="url(#gMetal)" stroke="#4a5064" stroke-width="1.5"/>
          <line x1="34" y1="62" x2="34" y2="94" stroke="#7dffa8" stroke-width="1" opacity=".45"/>
          <path d="M28 100 L22 116 M34 102 L34 118 M40 100 L46 116" stroke="#7dffa8" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle class="snap s-arm-l" cx="34" cy="78" r="6" fill="none" stroke="#7dffa8" stroke-width="2"/>
        </g>
        <g class="cy-part fly-arm-r d-arm-r">
          <rect x="178" y="56" width="16" height="44" rx="6" fill="url(#gMetal)" stroke="#4a5064" stroke-width="1.5"/>
          <line x1="186" y1="62" x2="186" y2="94" stroke="#7dffa8" stroke-width="1" opacity=".45"/>
          <path d="M180 100 L174 116 M186 102 L186 118 M192 100 L198 116" stroke="#7dffa8" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle class="snap s-arm-r" cx="186" cy="78" r="6" fill="none" stroke="#7dffa8" stroke-width="2"/>
        </g>
        <!-- 四边装甲板 -->
        <path class="cy-part fly-armor-t d-armor-t" d="M42 34 L178 34 L178 46 L42 46 Z" fill="#2a3042" stroke="#7dffa8" stroke-width="1.2"/>
        <path class="cy-part fly-armor-b d-armor-b" d="M42 152 L178 152 L178 164 L42 164 Z" fill="#2a3042" stroke="#7dffa8" stroke-width="1.2"/>
        <path class="cy-part fly-armor-l d-armor-l" d="M44 46 L56 46 L56 152 L44 152 Z" fill="#2a3042" stroke="#7dffa8" stroke-width="1.2"/>
        <path class="cy-part fly-armor-r d-armor-r" d="M164 46 L176 46 L176 152 L164 152 Z" fill="#2a3042" stroke="#7dffa8" stroke-width="1.2"/>
        <!-- 线缝 -->
        <g class="cy-part fly-seam d-armor-b" style="transition-delay:1.2s;">
          <path d="M42 48 L178 48" stroke="#7dffa8" stroke-width="1.2"/>
          <path d="M42 146 L178 146" stroke="#7dffa8" stroke-width="1.2"/>
          <path d="M58 32 L58 162" stroke="#7dffa8" stroke-width="1"/>
          <path d="M162 32 L162 162" stroke="#7dffa8" stroke-width="1"/>
          <g stroke="#4a5064" stroke-width="1.5"><line x1="150" y1="56" x2="162" y2="56"/><line x1="150" y1="64" x2="162" y2="64"/><line x1="150" y1="72" x2="162" y2="72"/></g>
        </g>
        <!-- 胸口能量核心（从天而降） -->
        <g class="cy-part fly-core d-core" filter="url(#fGlow)">
          <circle cx="110" cy="104" r="16" fill="url(#gCore)" opacity=".35"/>
          <circle cx="110" cy="104" r="9" fill="url(#gCore)" opacity=".8"/>
          <circle cx="110" cy="104" r="4" fill="#eafff3"/>
          <circle class="snap s-core" cx="110" cy="104" r="7" fill="none" stroke="#7dffa8" stroke-width="2"/>
        </g>
        <ellipse class="cy-part fly-core d-core" cx="110" cy="104" rx="24" ry="7" fill="none" stroke="#7dffa8" stroke-width="1" opacity=".45" transform="rotate(-14 110 104)"/>
        <!-- 赛博眼（最后到位） -->
        <g class="cy-part fly-eye d-eye c-eye" filter="url(#fGlow)">
          <path class="sharp" d="M62 74 L84 70 L84 84 L62 80 Z" fill="#7dffa8"/>
          <path class="sharp" d="M136 70 L158 74 L158 80 L136 84 Z" fill="#7dffa8"/>
          <path class="sharp" d="M62 77 L84 73 L84 81 L62 77 Z" fill="#eafff3" opacity=".85"/>
          <path class="sharp" d="M136 73 L158 77 L158 81 L136 81 Z" fill="#eafff3" opacity=".85"/>
          <!-- 反差彩蛋用的圆眼 -->
          <ellipse class="round" cx="74" cy="76" rx="9" ry="9" fill="#eaeaea"/>
          <ellipse class="round" cx="146" cy="76" rx="9" ry="9" fill="#eaeaea"/>
          <circle class="round" cx="77" cy="74" r="3.5" fill="#12121e"/>
          <circle class="round" cx="149" cy="74" r="3.5" fill="#12121e"/>
          <circle class="snap s-eye" cx="74" cy="76" r="6" fill="none" stroke="#7dffa8" stroke-width="2"/>
        </g>
        <!-- 线嘴 -->
        <path class="cy-part fly-eye d-eye" d="M94 128 L110 136 L126 128" stroke="#7dffa8" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </svg>
</div>

<div class="controls">
  <button class="btn btn-primary" id="btnMorph" onclick="morph()">⚡ 变身！</button>
  <button class="btn btn-ghost" id="btnRevert" onclick="revert()" disabled>变回去</button>
</div>
<div class="status" id="status">形态：Q版 · 日常</div>
<div class="timeline">组装序列：眼闪蓄力 → 白闪 → 腿飞来(0.45s/0.55s) → 臂飞来(0.75s/0.85s) → 装甲板四边贴合(1.1-1.4s) → 能量核心落下(1.65s) → 锐利眼到位(1.9s) → 光爆定格(2.15s) → 帅3秒 → 阿嚏！</div>

<script>
const stage = document.getElementById('stage');
const status = document.getElementById('status');
const btnMorph = document.getElementById('btnMorph');
const btnRevert = document.getElementById('btnRevert');
let isCyborg = false, busy = false, derpTimer = null;

function morph() {
  if (busy) return;
  busy = true; btnMorph.disabled = true; btnRevert.disabled = true;
  status.textContent = '组装开始…部件飞来中';
  stage.classList.remove('derp');
  stage.classList.add('transforming');
  setTimeout(() => {
    stage.classList.remove('transforming');
    stage.classList.add('cyborg');
    status.textContent = '形态：赛博义体 · 危险模式（保持3秒…）';
    btnRevert.disabled = false;
    busy = false;
    // 反差彩蛋：酷不过三秒
    setTimeout(() => {
      if (stage.classList.contains('cyborg')) {
        stage.classList.add('derp');
        status.textContent = '…阿嚏！';
        setTimeout(() => {
          stage.classList.remove('derp');
          status.textContent = '形态：赛博义体 · 危险模式（刚才那是风）';
        }, 1800);
      }
    }, 3200);
  }, 2650);
}

function revert() {
  if (busy) return;
  busy = true; btnMorph.disabled = true; btnRevert.disabled = true;
  status.textContent = '解除变身…';
  stage.classList.remove('cyborg', 'derp');
  stage.classList.add('transforming');
  setTimeout(() => {
    stage.classList.remove('transforming');
    status.textContent = '形态：Q版 · 日常（刚才那个不是我）';
    btnMorph.disabled = false;
    busy = false;
  }, 900);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>零 · 快递盒 → 赛博像素小人（变身 v3）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; background:#0e0e18; color:#eaeaea; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:30px; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:#888; font-size:13px; margin-bottom:22px; }

  .stage { width:480px; height:480px; background:radial-gradient(circle at 50% 42%, #12122a, #08080f); border-radius:20px; border:1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  svg { display:block; }

  .controls { display:flex; gap:14px; margin-top:22px; }
  .btn { padding:12px 30px; border-radius:12px; border:none; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-primary { background:#00fff7; color:#0e0e18; }
  .btn-ghost { background:rgba(255,255,255,.1); color:#ddd; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .status { margin-top:14px; font-size:13px; color:#888; min-height:22px; text-align:center; }
  .timeline { margin-top:8px; font-size:11px; color:#555; max-width:430px; text-align:center; line-height:1.8; }

  /* 快递盒 */
  .box-part { transition: all .35s ease; }
  .exploding .box-main { opacity:0; transform:scale(1.25); }
  .exploding .box-leg-l { opacity:0; transform:translate(-30px, 20px) rotate(-30deg); }
  .exploding .box-leg-r { opacity:0; transform:translate(30px, 20px) rotate(30deg); }
  .exploding .box-eye { opacity:0; }

  /* 盒子碎片 */
  .shard { position:absolute; opacity:0; }
  .exploding .shard { animation: shard-fly .6s ease .25s forwards; }
  @keyframes shard-fly { 0%{opacity:1; transform:translate(0,0) rotate(0);} 100%{opacity:0; transform:translate(var(--dx), var(--dy)) rotate(var(--rot, 180deg));} }

  /* 蓄力/闪光 */
  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  .exploding .flash { animation: flash-blink .45s ease .2s 2; }
  @keyframes flash-blink { 0%{opacity:0;} 25%{opacity:.9;} 50%{opacity:0;} 100%{opacity:0;} }

  .eyecharge { position:absolute; width:130px; height:130px; left:50%; top:42%; margin-left:-65px; margin-top:-65px; border-radius:50%; opacity:0; background:radial-gradient(circle, rgba(0,255,247,.55), transparent 70%); }
  .exploding .eyecharge { animation: charge .5s ease .05s forwards; }
  @keyframes charge { 0%{opacity:0; transform:scale(.3);} 60%{opacity:.9;} 100%{opacity:0; transform:scale(1.5);} }

  .shake { animation:none; }
  .exploding .shake { animation: body-shake .4s ease .15s; }
  @keyframes body-shake { 0%,100%{transform:translate(0);} 20%{transform:translate(-3px,1px);} 40%{transform:translate(3px,-1px);} 60%{transform:translate(-2px,-1px);} 80%{transform:translate(2px,1px);} }

  /* 像素粒子（JS 生成，聚合动画） */
  .px { opacity:0; transition: transform .32s cubic-bezier(.2,.75,.25,1.2), opacity .1s ease; }
  .cyborg .px { opacity:1; transform: translate(0,0) !important; }

  .burst { position:absolute; width:380px; height:380px; border-radius:50%; opacity:0; pointer-events:none; background:radial-gradient(circle, rgba(0,255,247,.5), rgba(255,0,230,.12) 45%, transparent 70%); }
  .cyborg .burst { animation: burst-out .6s ease .8s forwards; }
  @keyframes burst-out { 0%{opacity:0; transform:scale(.2);} 30%{opacity:1;} 100%{opacity:0; transform:scale(2.4);} }

  .ring { position:absolute; width:240px; height:240px; border:2px solid rgba(0,255,247,.65); border-radius:50%; opacity:0; }
  .cyborg .ring { animation: ring-out .7s ease .75s forwards; }
  @keyframes ring-out { 0%{opacity:0; transform:scale(.3);} 40%{opacity:.9;} 100%{opacity:0; transform:scale(1.9);} }

  .finish-glow { position:absolute; inset:-30px; background:radial-gradient(circle at 50% 42%, rgba(0,255,247,.2), transparent 60%); opacity:0; pointer-events:none; transition:opacity .6s .9s; }
  .cyborg .finish-glow { opacity:.45; }

  /* 像素霓虹呼吸 */
  .cyborg .px-glow { animation: pixel-breathe 2.4s ease-in-out infinite; }
  @keyframes pixel-breathe { 0%,100%{filter:drop-shadow(0 0 2px rgba(0,255,247,.5));} 50%{filter:drop-shadow(0 0 7px rgba(0,255,247,.9));} }

  /* ═══ 反差彩蛋：像素打喷嚏 ═══ */
  .derp .px { animation: pixel-sneeze .5s ease; }
  @keyframes pixel-sneeze { 0%,100%{transform:translate(0);} 20%{transform:translate(-2px,-3px);} 40%{transform:translate(2px,-2px);} 60%{transform:translate(-1px,1px);} 80%{transform:translate(1px,1px);} }
  .derp .px-eye { filter: none; }
  .derp .px-eye-round { opacity:1 !important; }
  .px-eye-round { opacity:0; }
  .derp-bubble { position:absolute; top:70px; left:calc(50% + 40px); background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); padding:6px 12px; border-radius:14px; font-size:13px; color:#00fff7; opacity:0; transform:translateY(6px); }
  .derp .derp-bubble { animation: pop-in .35s ease 1.1s forwards; }
  @keyframes pop-in { to { opacity:1; transform:translateY(0);} }

  /* 像素扫屏错乱（8-bit 降噪） */
  .glitch { position:absolute; inset:0; pointer-events:none; opacity:0; }
  .derp .glitch { animation: glitch-flicker .4s steps(2) .15s 3; }
  @keyframes glitch-flicker { 0%{opacity:0;} 50%{opacity:.25;} 100%{opacity:0;} }
</style>
</head>
<body>

<h1>⬡ 零 · 快递盒 → 赛博像素小人</h1>
<div class="sub">日常是只快递盒，认真起来是个赛博朋克像素小人 —— 画风级反差</div>

<div class="stage" id="stage">
  <div class="finish-glow"></div>
  <div class="burst"></div>
  <div class="ring"></div>
  <div class="flash"></div>
  <div class="eyecharge"></div>
  <div class="glitch" style="background:linear-gradient(transparent 30%, rgba(0,255,247,.15) 30%, rgba(0,255,247,.15) 33%, transparent 33%, transparent 66%, rgba(255,0,230,.15) 66%, rgba(255,0,230,.15) 70%, transparent 70%);"></div>
  <div class="derp-bubble">阿嚏！…像素都飞了。</div>

  <svg id="svgRoot" width="430" height="430" viewBox="0 0 220 220">
    <defs>
      <radialGradient id="boxShade" cx=".35" cy=".3">
        <stop offset="0" stop-color="#d9a06b"/><stop offset="1" stop-color="#a56a3d"/>
      </radialGradient>
    </defs>

    <!-- ═══ 快递盒（日常形态） ═══ -->
    <g id="boxGroup" class="shake">
      <!-- 盒子腿 -->
      <rect class="box-part box-leg-l" x="72" y="168" width="14" height="22" rx="5" fill="#8a5630"/>
      <rect class="box-part box-leg-r" x="134" y="168" width="14" height="22" rx="5" fill="#8a5630"/>
      <!-- 盒子主体 -->
      <rect class="box-part box-main" x="58" y="66" width="104" height="104" rx="6" fill="url(#boxShade)" stroke="#7a4a26" stroke-width="2.5"/>
      <!-- 盒盖折线 -->
      <path class="box-part box-main" d="M58 66 L110 92 L162 66" fill="none" stroke="#7a4a26" stroke-width="2"/>
      <path class="box-part box-main" d="M58 92 L110 118 L162 92" fill="none" stroke="#a56a3d" stroke-width="1.2" opacity=".5"/>
      <!-- 胶带十字 -->
      <rect class="box-part box-main" x="58" y="108" width="104" height="16" rx="2" fill="#e0b080" opacity=".85"/>
      <rect class="box-part box-main" x="102" y="66" width="16" height="104" rx="2" fill="#e0b080" opacity=".85"/>
      <!-- 运单标签 -->
      <rect class="box-part box-main" x="74" y="78" width="72" height="24" rx="3" fill="#fff" opacity=".9"/>
      <text class="box-part box-main" x="110" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#7a4a26">零 · FRAGILE</text>
      <!-- 盒子萌眼（贴在胶带两侧） -->
      <g class="box-part box-eye">
        <circle cx="88" cy="132" r="5.5" fill="#1c1c2e"/>
        <circle cx="132" cy="132" r="5.5" fill="#1c1c2e"/>
        <circle cx="90" cy="130" r="1.8" fill="#fff"/>
        <circle cx="134" cy="130" r="1.8" fill="#fff"/>
      </g>
      <!-- 呆萌嘴 -->
      <path class="box-part box-eye" d="M102 146 Q110 141 118 146" stroke="#1c1c2e" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 盒子碎片（爆炸时飞散） -->
    <rect class="shard" x="60" y="80" width="16" height="16" fill="#c8875a" style="--dx:-70px; --dy:-60px; --rot:160deg;"/>
    <rect class="shard" x="150" y="100" width="14" height="14" fill="#a56a3d" style="--dx:80px; --dy:-40px; --rot:-200deg;"/>
    <rect class="shard" x="70" y="140" width="14" height="14" fill="#e0b080" style="--dx:-60px; --dy:70px; --rot:140deg;"/>
    <rect class="shard" x="140" y="150" width="16" height="16" fill="#c8875a" style="--dx:70px; --dy:60px; --rot:-150deg;"/>

    <!-- ═══ 像素小人（JS 生成） ═══ -->
    <g id="pixelGroup"></g>
  </svg>
</div>

<div class="controls">
  <button class="btn btn-primary" id="btnMorph" onclick="morph()">⚡ 开箱！</button>
  <button class="btn btn-ghost" id="btnRevert" onclick="revert()" disabled>变回盒子</button>
</div>
<div class="status" id="status">形态：快递盒 · 待开箱</div>
<div class="timeline">开箱序列：眼闪蓄力 → 盒子震动爆闪 → 盒子碎片飞散 → 像素粒子从四周聚合(0.3-1.5s) → 霓虹定格光爆 → 酷3秒 → 阿嚏！像素飞散又聚回</div>

<script>
// ═══════ 像素小人图案（16 列 x 18 行） ═══════
// C=青 #00fff7  W=亮白  P=品红 #ff00e6  .=透明
const SPRITE = [
  "....CCCCCCCC....",
  "..CCCCCCCCCCCC..",
  ".CCCCCCCCCCCCCC.",
  ".CCCCCCCCCCCCCC.",
  ".CCCCWWCCWWCCCC.",
  ".CCCCCCCCCCCCCC.",
  ".CCCCCCCCCCCCCC.",
  "..CCCCCCCCCCCC..",
  "...CCCPPCCPPCC..",
  "...CCCCCCCCCC...",
  "..CCC..CCCC..CCC",
  "..CCC..CCCC..CCC",
  "..CCC..CCCC..CCC",
  "..CCCCCCCCCCCC..",
  "...CCC..CCC..CCC",
  "...CCC..CCC..CCC",
  "..CCCCC.CCCCC...",
  "..CCCCC.CCCCC...",
];

const PX = 9; // 像素大小
const ORIGIN_X = 34, ORIGIN_Y = 24;

function buildPixelSprite() {
  const g = document.getElementById('pixelGroup');
  const rows = SPRITE.length, cols = SPRITE[0].length;
  const cx = ORIGIN_X + cols * PX / 2, cy = ORIGIN_Y + rows * PX / 2;
  let maxDelay = 0;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ch = SPRITE[r][c];
      if (ch === '.') continue;
      const x = ORIGIN_X + c * PX, y = ORIGIN_Y + r * PX;
      let color = '#00fff7';
      if (ch === 'W') color = '#eafff3';
      if (ch === 'P') color = '#ff00e6';
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', x); rect.setAttribute('y', y);
      rect.setAttribute('width', PX - 1); rect.setAttribute('height', PX - 1);
      rect.setAttribute('rx', 1.2);
      rect.setAttribute('fill', color);
      // 眼睛像素加霓虹辉光
      if (ch === 'W') rect.classList.add('px-eye', 'px-glow');
      // 距离中心的远近决定飞入延迟（外圈先飞，内圈后到 → 聚合感）
      const dist = Math.hypot((x + PX/2) - cx, (y + PX/2) - cy);
      const delay = dist / 220 * 1.15 + Math.random() * 0.12;
      maxDelay = Math.max(maxDelay, delay);
      // 初始位置：从画面外飞入（方向 = 从中心指向像素的延长线）
      const ang = Math.atan2((y + PX/2) - cy, (x + PX/2) - cx);
      const flyDist = 260 + Math.random() * 60;
      const dx = Math.cos(ang) * flyDist, dy = Math.sin(ang) * flyDist;
      rect.style.transform = `translate(${dx}px, ${dy}px)`;
      rect.style.transitionDelay = delay + 's';
      rect.classList.add('px');
      g.appendChild(rect);
    }
  }
  return maxDelay;
}

const stage = document.getElementById('stage');
const status = document.getElementById('status');
const btnMorph = document.getElementById('btnMorph');
const btnRevert = document.getElementById('btnRevert');
let busy = false, pixelDone = false;

buildPixelSprite();

function morph() {
  if (busy) return;
  busy = true; btnMorph.disabled = true; btnRevert.disabled = true;
  status.textContent = '开箱…';
  stage.classList.remove('cyborg', 'derp');
  stage.classList.add('exploding');
  setTimeout(() => {
    stage.classList.remove('exploding');
    stage.classList.add('cyborg');
    status.textContent = '形态：赛博像素小人 · 危险模式（保持3秒…）';
    btnRevert.disabled = false;
    busy = false;
    // 反差彩蛋：像素打喷嚏
    setTimeout(() => {
      if (stage.classList.contains('cyborg')) {
        stage.classList.add('derp');
        status.textContent = '…阿嚏！像素都飞了';
        setTimeout(() => {
          stage.classList.remove('derp');
          status.textContent = '形态：赛博像素小人（像素已归位，刚才那是静电）';
        }, 1900);
      }
    }, 3400);
  }, 900);
}

function revert() {
  if (busy) return;
  busy = true; btnMorph.disabled = true; btnRevert.disabled = true;
  status.textContent = '装箱…';
  stage.classList.remove('cyborg', 'derp', 'exploding');
  setTimeout(() => {
    status.textContent = '形态：快递盒 · 待开箱（刚才那个不是我）';
    btnMorph.disabled = false;
    busy = false;
  }, 300);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>零 · 概念图还原版 v6</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; background:#0e0e18; color:#eaeaea; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:30px; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:#888; font-size:13px; margin-bottom:22px; }

  .stage { width:540px; height:540px; background:radial-gradient(circle at 50% 42%, #13132a, #08080f); border-radius:20px; border:1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  svg { display:block; }

  .controls { display:flex; gap:14px; margin-top:22px; }
  .btn { padding:12px 30px; border-radius:12px; border:none; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-primary { background:#00fff7; color:#0e0e18; }
  .btn-ghost { background:rgba(255,255,255,.1); color:#ddd; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .status { margin-top:14px; font-size:13px; color:#888; min-height:22px; text-align:center; }
  .timeline { margin-top:8px; font-size:11px; color:#555; max-width:470px; text-align:center; line-height:1.8; }

  /* Q版萌物 */
  .q-part { transition: all .3s ease; }
  .exploding .q-body, .exploding .q-eye, .exploding .q-mouth { opacity:0; transform:scale(1.2); }
  .exploding .q-leg-l { opacity:0; transform:translate(-26px,18px) rotate(-28deg); }
  .exploding .q-leg-r { opacity:0; transform:translate(26px,18px) rotate(28deg); }
  .exploding .q-arm-l { opacity:0; transform:rotate(150deg) translate(-8px,-16px); }
  .exploding .q-arm-r { opacity:0; transform:rotate(-150deg) translate(8px,-16px); }

  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  .exploding .flash { animation: flash-blink .45s ease .2s 2; }
  @keyframes flash-blink { 0%{opacity:0;} 25%{opacity:.9;} 50%{opacity:0;} 100%{opacity:0;} }
  .eyecharge { position:absolute; width:140px; height:140px; left:50%; top:42%; margin-left:-70px; margin-top:-70px; border-radius:50%; opacity:0; background:radial-gradient(circle, rgba(0,255,247,.55), transparent 70%); }
  .exploding .eyecharge { animation: charge .5s ease .05s forwards; }
  @keyframes charge { 0%{opacity:0; transform:scale(.3);} 60%{opacity:.9;} 100%{opacity:0; transform:scale(1.5);} }
  .shake { animation:none; }
  .exploding .shake { animation: body-shake .4s ease .15s; }
  @keyframes body-shake { 0%,100%{transform:translate(0);} 20%{transform:translate(-3px,1px);} 40%{transform:translate(3px,-1px);} 60%{transform:translate(-2px,-1px);} 80%{transform:translate(2px,1px);} }

  .px { opacity:0; transition: transform .34s cubic-bezier(.2,.75,.25,1.2), opacity .1s ease; }
  .cyborg .px { opacity:1; transform: translate(0,0) !important; }

  .burst { position:absolute; width:440px; height:440px; border-radius:50%; opacity:0; pointer-events:none; background:radial-gradient(circle, rgba(0,255,247,.5), rgba(255,0,230,.12) 45%, transparent 70%); }
  .cyborg .burst { animation: burst-out .6s ease 1.1s forwards; }
  @keyframes burst-out { 0%{opacity:0; transform:scale(.2);} 30%{opacity:1;} 100%{opacity:0; transform:scale(2.4);} }
  .ring { position:absolute; width:270px; height:270px; border:2px solid rgba(0,255,247,.65); border-radius:50%; opacity:0; }
  .cyborg .ring { animation: ring-out .7s ease 1.05s forwards; }
  @keyframes ring-out { 0%{opacity:0; transform:scale(.3);} 40%{opacity:.9;} 100%{opacity:0; transform:scale(1.9);} }
  .finish-glow { position:absolute; inset:-30px; background:radial-gradient(circle at 50% 42%, rgba(0,255,247,.22), transparent 60%); opacity:0; pointer-events:none; transition:opacity .6s 1.2s; }
  .cyborg .finish-glow { opacity:.5; }
  .cyborg .px-glow { animation: pixel-breathe 2.6s ease-in-out infinite; }
  @keyframes pixel-breathe { 0%,100%{filter:drop-shadow(0 0 2px rgba(0,255,247,.4));} 50%{filter:drop-shadow(0 0 9px rgba(0,255,247,.9));} }
  .scanlines { position:absolute; inset:0; pointer-events:none; opacity:0; background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.18) 3px 4px); }
  .cyborg .scanlines { opacity:.6; transition:opacity .5s 1.3s; }

  .derp .px { animation: pixel-sneeze .5s ease; }
  @keyframes pixel-sneeze { 0%,100%{transform:translate(0);} 20%{transform:translate(-2px,-3px);} 40%{transform:translate(2px,-2px);} 60%{transform:translate(-1px,1px);} 80%{transform:translate(1px,1px);} }
  .derp .px-eye-cyborg { opacity:0 !important; }
  .px-eye-cyborg { transition:opacity .2s; }
  .derp .px-eye-round { opacity:1 !important; }
  .px-eye-round { opacity:0; }
  .derp-bubble { position:absolute; top:56px; left:calc(50% + 54px); background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); padding:6px 12px; border-radius:14px; font-size:13px; color:#00fff7; opacity:0; transform:translateY(6px); }
  .derp .derp-bubble { animation: pop-in .35s ease 1.15s forwards; }
  @keyframes pop-in { to { opacity:1; transform:translateY(0);} }
  .glitch { position:absolute; inset:0; pointer-events:none; opacity:0; background:linear-gradient(transparent 30%, rgba(0,255,247,.12) 30%, rgba(0,255,247,.12) 33%, transparent 33%, transparent 66%, rgba(255,0,230,.12) 66%, rgba(255,0,230,.12) 70%, transparent 70%); }
  .derp .glitch { animation: glitch-flicker .4s steps(2) .15s 3; }
  @keyframes glitch-flicker { 0%{opacity:0;} 50%{opacity:.3;} 100%{opacity:0;} }
</style>
</head>
<body>

<h1>⬡ 零 · 概念图还原版 v6</h1>
<div class="sub">照着 Krea2_turbo_00089 概念图转 SVG：天线方块头 · 发光眼 · 能量剑 · 分段装甲 · 深网格背景</div>

<div class="stage" id="stage">
  <div class="scanlines"></div>
  <div class="finish-glow"></div>
  <div class="burst"></div>
  <div class="ring"></div>
  <div class="flash"></div>
  <div class="eyecharge"></div>
  <div class="glitch"></div>
  <div class="derp-bubble">阿嚏！…剑差点没握住。</div>

  <svg id="svgRoot" width="490" height="490" viewBox="0 0 220 220">
    <!-- 深网格背景（像素世界） -->
    <g id="bgGrid">
      <rect x="0" y="0" width="220" height="220" fill="#0a0a16"/>
      <path d="M20 0 V220 M40 0 V220 M60 0 V220 M80 0 V220 M100 0 V220 M120 0 V220 M140 0 V220 M160 0 V220 M180 0 V220 M200 0 V220" stroke="#141428" stroke-width="1"/>
      <path d="M0 20 H220 M0 40 H220 M0 60 H220 M0 80 H220 M0 100 H220 M0 120 H220 M0 140 H220 M0 160 H220 M0 180 H220 M0 200 H220" stroke="#141428" stroke-width="1"/>
      <circle cx="18" cy="14" r="1.2" fill="#00fff7" opacity=".4"/><circle cx="204" cy="26" r="1" fill="#ff00e6" opacity=".35"/>
      <circle cx="10" cy="130" r="1" fill="#00fff7" opacity=".3"/><circle cx="212" cy="160" r="1.2" fill="#ff00e6" opacity=".35"/>
    </g>

    <!-- Q版萌物 -->
    <g id="qGroup" class="shake">
      <g class="q-part">
        <rect class="q-leg-l" x="60" y="118" width="16" height="30" rx="8" fill="#2a2a3e"/>
        <rect class="q-leg-r" x="144" y="118" width="16" height="30" rx="8" fill="#2a2a3e"/>
        <g class="q-arm-l"><rect x="34" y="40" width="14" height="44" rx="7" fill="#2a2a3e"/></g>
        <g class="q-arm-r"><rect x="172" y="40" width="14" height="44" rx="7" fill="#2a2a3e"/></g>
        <rect class="q-body" x="42" y="26" width="136" height="136" rx="42" fill="#1c1c2e" stroke="#7dffa8" stroke-width="3"/>
        <g class="q-eye">
          <ellipse cx="74" cy="72" rx="11" ry="10" fill="#eaeaea"/>
          <ellipse cx="146" cy="72" rx="11" ry="10" fill="#eaeaea"/>
          <circle cx="77" cy="70" r="4" fill="#12121e"/>
          <circle cx="149" cy="70" r="4" fill="#12121e"/>
          <circle cx="80" cy="66" r="1.6" fill="#fff"/>
          <circle cx="152" cy="66" r="1.6" fill="#fff"/>
        </g>
        <path class="q-mouth" d="M98 100 Q110 94 122 100" stroke="#eaeaea" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- 像素小人（程序绘制，v6 概念还原） -->
    <g id="pixelGroup"></g>
  </svg>
</div>

<div class="controls">
  <button class="btn btn-primary" id="btnMorph" onclick="morph()">⚡ 变身！</button>
  <button class="btn btn-ghost" id="btnRevert" onclick="revert()" disabled>变回去</button>
</div>
<div class="status" id="status">形态：Q版萌物 · 日常</div>
<div class="timeline">v6 还原：天线方块头 · 双发光眼 · 能量剑 · 分段装甲（肩/胸/腿）· 品红霓虹边线 · 胸口核心 · 深网格背景 · 像素聚合变身</div>

<script>
// ═══════════ v6 像素绘制（概念图还原） ═══════════
const C = {
  K: '#0f0f1c',   // 描边暗底
  A: '#1a2b4a',   // 装甲深蓝
  B: '#2e4a7a',   // 装甲中蓝
  D: '#00e5ff',   // 霓虹青（主）
  E: '#e8fbff',   // 高光
  M: '#ff2bd6',   // 品红
  P: '#6a1060',   // 暗品红
  W: '#ffffff',
  N: '#3a3a4e',   // 金属灰
  S: '#8a8aa0',   // 亮金属
};
const PXS = 2.6;
const rects = [];
function px(x, y, w=1, h=1, color=C.D) {
  rects.push({ x: x*PXS, y: y*PXS, w: w*PXS-0.3, h: h*PXS-0.3, color, gx:x, gy:y });
}
const OX = 58, OY = 20;

// ══ 天线（两根，顶部） ══
px(8,1,1,2,C.N); px(13,1,1,2,C.N);
px(7,2,1,1,C.D); px(14,2,1,1,C.D);
px(8,3,1,1,C.D); px(13,3,1,1,C.D);

// ══ 头（方块立方感 18x12） ══
px(4,4,18,1,C.A); px(5,4,16,1,C.B);
px(3,5,1,1,C.K); px(4,5,18,1,C.B); px(22,5,1,1,C.K);
px(3,6,1,6,C.K);
// 发光眼（大而醒目）
px(5,6,3,3,C.K); px(6,7,1,1,C.E); px(7,7,1,1,C.D); px(5,8,3,1,C.D);
px(14,6,3,3,C.K); px(15,7,1,1,C.E); px(16,7,1,1,C.D); px(14,8,3,1,C.D);
// 面部装甲
px(5,9,5,1,C.B); px(10,9,4,1,C.D); px(14,9,5,1,C.B);
px(4,10,7,1,C.A); px(11,10,2,1,C.M); px(13,10,7,1,C.A);
px(3,11,1,1,C.K); px(4,11,18,1,C.A); px(22,11,1,1,C.K);
px(5,12,16,1,C.B);

// ══ 肩甲（超出身体） ══
px(1,13,2,3,C.N); px(3,13,2,1,C.D); px(5,13,2,1,C.S);
px(21,13,2,3,C.N); px(23,13,2,1,C.D); px(25,13,2,1,C.S);
px(1,16,2,1,C.N); px(25,16,2,1,C.N);
px(1,14,1,1,C.M); px(25,14,1,1,C.M);   // 肩甲品红点缀

// ══ 身体（分段装甲 24x13） ══
px(3,13,1,13,C.K); px(22,13,1,13,C.K);
// 胸甲（亮区）
for (let r=13; r<20; r++) {
  px(4,r,5,1,C.A); px(9,r,5,1,C.B); px(14,r,5,1,C.D); px(19,r,5,1,C.B);
}
// 胸口核心（蓝光）
px(8,15,3,3,C.P); px(9,15,1,1,C.M); px(11,15,3,3,C.P); px(12,15,1,1,C.M);
px(10,17,2,2,C.M); px(11,17,1,1,C.E);
// 腰部品红电路线
px(5,18,2,1,C.P); px(17,18,2,1,C.P); px(6,18,1,1,C.M); px(18,18,1,1,C.M);
// 腰带（金属）
px(3,19,1,1,C.K); px(4,19,18,1,C.N); px(22,19,1,1,C.K);
px(10,20,4,1,C.D); px(11,20,2,1,C.E);
// 下摆（分层）
px(4,20,18,1,C.B); px(5,21,1,1,C.K); px(6,21,14,1,C.A); px(20,21,1,1,C.K);
px(4,22,2,1,C.K); px(6,22,12,1,C.A); px(20,22,2,1,C.K);
px(5,23,2,1,C.K); px(7,23,10,1,C.A); px(19,23,2,1,C.K);
px(6,24,2,1,C.K); px(8,24,8,1,C.A); px(18,24,2,1,C.K);
px(7,25,2,1,C.K); px(9,25,6,1,C.A); px(17,25,2,1,C.K);

// ══ 手臂 ══
// 左臂（垂）
px(0,14,1,2,C.K); px(1,14,2,1,C.B); px(3,14,1,2,C.K);
px(1,16,2,1,C.D); px(1,17,2,1,C.B); px(1,18,2,1,C.D);
px(0,19,1,1,C.K); px(1,19,2,1,C.N); px(3,19,1,1,C.K);
px(0,20,1,1,C.M); px(3,20,1,1,C.M);   // 手套品红
// 右臂（握剑）
px(24,14,1,2,C.K); px(25,14,2,1,C.B); px(27,14,1,2,C.K);
px(25,16,2,1,C.D); px(25,17,2,1,C.B); px(25,18,2,1,C.D);
px(24,19,1,1,C.K); px(25,19,2,1,C.N); px(27,19,1,1,C.K);
px(24,20,1,1,C.M); px(27,20,1,1,C.M);

// ══ 能量剑（斜举，青蓝发光） ══
px(27,2,1,1,C.E); px(28,2,1,1,C.D); px(29,2,1,1,C.M);
px(28,3,1,1,C.D); px(29,3,1,1,C.M); px(30,3,1,1,C.D);
for (let r=4; r<13; r++) { px(29,r,1,1,C.D); px(30,r,1,1,C.E); px(31,r,1,1,C.D); }
px(29,13,1,1,C.M); px(30,13,1,1,C.D);
px(27,14,6,1,C.N); px(29,14,2,1,C.D);
px(29,15,1,2,C.N);

// ══ 腿（分段装甲 + 发光关节 + 靴） ══
// 左腿
px(6,26,6,1,C.B);
for (let r=27; r<32; r++) { px(6,r,2,1,C.A); px(8,r,2,1,C.B); px(10,r,2,1,C.D); }
px(7,32,4,1,C.K); px(8,32,2,1,C.D); px(9,32,1,1,C.E);
px(6,33,6,1,C.B); px(7,34,4,1,C.D);
px(6,35,2,1,C.K); px(8,35,2,1,C.N); px(10,35,2,1,C.K);
px(5,36,8,1,C.N); px(7,36,2,1,C.D); px(6,36,1,1,C.M);
// 右腿
px(18,26,6,1,C.B);
for (let r=27; r<32; r++) { px(18,r,2,1,C.D); px(20,r,2,1,C.B); px(22,r,2,1,C.A); }
px(19,32,4,1,C.K); px(20,32,2,1,C.D); px(21,32,1,1,C.E);
px(18,33,6,1,C.B); px(19,34,4,1,C.D);
px(18,35,2,1,C.K); px(20,35,2,1,C.N); px(22,35,2,1,C.K);
px(17,36,8,1,C.N); px(20,36,2,1,C.D); px(23,36,1,1,C.M);

// ══ 渲染 ══
function render() {
  const g = document.getElementById('pixelGroup');
  const cx = 110, cy = 100;
  let maxDelay = 0;
  rects.forEach(p => {
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', OX + p.x); r.setAttribute('y', OY + p.y);
    r.setAttribute('width', p.w); r.setAttribute('height', p.h);
    r.setAttribute('fill', p.color);
    if (p.color === C.D || p.color === C.E) r.classList.add('px-glow');
    if (p.color === C.E && p.gy >= 6 && p.gy <= 8) {
      r.classList.add('px-eye-cyborg');
      const ex = OX + p.x + PXS/2, ey = OY + p.y + PXS/2;
      const side = ex < 110 ? -1 : 1;
      const round = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      round.setAttribute('cx', ex + side*2.5); round.setAttribute('cy', ey);
      round.setAttribute('rx', 4.2); round.setAttribute('ry', 4.6);
      round.setAttribute('fill', '#eaeaea'); round.classList.add('px-eye-round');
      g.appendChild(round);
      const pupil = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      pupil.setAttribute('cx', ex + side*2.5); pupil.setAttribute('cy', ey);
      pupil.setAttribute('r', 1.8); pupil.setAttribute('fill', '#12121e');
      pupil.classList.add('px-eye-round');
      g.appendChild(pupil);
    }
    const dist = Math.hypot(p.x - cx + OX, p.y - cy + OY);
    const delay = dist / 240 * 1.5 + Math.random() * 0.15;
    maxDelay = Math.max(maxDelay, delay);
    const ang = Math.atan2((p.y + OY) - cy, (p.x + OX) - cx);
    const flyDist = 340 + Math.random() * 90;
    r.style.transform = `translate(${Math.cos(ang)*flyDist}px, ${Math.sin(ang)*flyDist}px)`;
    r.style.transitionDelay = delay + 's';
    r.classList.add('px');
    g.appendChild(r);
  });
}
render();

const stage = document.getElementById('stage');
const status = document.getElementById('status');
const btnMorph = document.getElementById('btnMorph');
const btnRevert = document.getElementById('btnRevert');
let busy = false;

function morph() {
  if (busy) return;
  busy = true; btnMorph.disabled = true; btnRevert.disabled = true;
  status.textContent = '变身启动…';
  stage.classList.remove('cyborg', 'derp');
  stage.classList.add('exploding');
  setTimeout(() => {
    stage.classList.remove('exploding');
    stage.classList.add('cyborg');
    status.textContent = '形态：像素战士零 · 危险模式（保持3秒…）';
    btnRevert.disabled = false;
    busy = false;
    setTimeout(() => {
      if (stage.classList.contains('cyborg')) {
        stage.classList.add('derp');
        status.textContent = '…阿嚏！剑差点没握住';
        setTimeout(() => {
          stage.classList.remove('derp');
          status.textContent = '形态：像素战士零（剑已握稳，刚才是静电）';
        }, 1900);
      }
    }, 3400);
  }, 900);
}

function revert() {
  if (busy) return;
  busy = true; btnMorph.disabled = true; btnRevert.disabled = true;
  status.textContent = '解除变身…';
  stage.classList.remove('cyborg', 'derp', 'exploding');
  setTimeout(() => {
    status.textContent = '形态：Q版萌物 · 日常（刚才那个不是我）';
    btnMorph.disabled = false;
    busy = false;
  }, 300);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>零 · MJ 舞蹈 v9.3（表情大师版）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; background:#07070f; color:#eaeaea; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:30px; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:#888; font-size:13px; margin-bottom:22px; }

  .stage { width:760px; height:420px; border-radius:16px; position:relative; overflow:hidden;
    background:radial-gradient(ellipse at 50% 120%, #1a1a38 0%, #0a0a18 60%, #05050c 100%); border:1px solid rgba(255,255,255,.08); }
  .floor { position:absolute; bottom:0; left:0; right:0; height:60px; background:linear-gradient(transparent, rgba(0,0,0,.6)); }
  .floor-glow { position:absolute; bottom:-20px; left:50%; transform:translateX(-50%); width:340px; height:80px; background:radial-gradient(ellipse, rgba(255,220,120,.16), transparent 70%); }
  .spotlight { position:absolute; top:-30px; left:50%; transform:translateX(-50%); width:300px; height:380px;
    background:linear-gradient(to bottom, rgba(255,240,200,.22), rgba(255,240,200,.05) 70%, transparent);
    clip-path:polygon(38% 0, 62% 0, 100% 100%, 0 100%); opacity:0; transition:opacity 1s; }
  .stage.lights-on .spotlight { opacity:1; }
  .stage-lights { position:absolute; inset:0; opacity:0; transition:opacity 1s; pointer-events:none;
    background:repeating-conic-gradient(from 0deg at 50% 100%, rgba(125,60,255,.08) 0deg 8deg, transparent 8deg 18deg); }
  .stage.lights-on .stage-lights { opacity:1; animation:sweep 6s linear infinite; }
  @keyframes sweep { to { transform:rotate(360deg); } }

  #zero { position:absolute; bottom:44px; left:50%; width:170px; height:170px; margin-left:-85px; z-index:3; transform-origin:50% 100%; }
  .zero-svg { display:block; }
  .p-part { transition: transform .25s ease; }

  /* ════ 舞蹈动作 ════ */
  .seq-enter .hat { animation:hat-tip 1s ease; transform-origin:85px 30px; }
  @keyframes hat-tip { 0%{transform:rotate(0);} 40%{transform:rotate(-14deg) translateY(-4px);} 100%{transform:rotate(0);} }
  .seq-enter .arm-r { transform:rotate(-40deg) translateY(-6px); transform-origin:140px 60px; }

  .seq-moonwalk { animation:moonwalk-back 3.2s linear infinite; }
  @keyframes moonwalk-back { from { transform:translateX(55px);} to { transform:translateX(-55px);} }
  .seq-moonwalk .body-tilt { transform:rotate(-6deg); }
  .seq-moonwalk .leg-l { animation:glide-l .8s ease-in-out infinite; transform-origin:74px 132px; }
  .seq-moonwalk .leg-r { animation:glide-r .8s ease-in-out infinite; transform-origin:110px 132px; }
  @keyframes glide-l { 0%{transform:rotate(14deg);} 50%{transform:rotate(-26deg) translateX(10px);} 100%{transform:rotate(14deg);} }
  @keyframes glide-r { 0%{transform:rotate(-26deg) translateX(10px);} 50%{transform:rotate(14deg);} 100%{transform:rotate(-26deg) translateX(10px);} }
  .seq-moonwalk .arm-l { animation:mw-arm-l .8s ease-in-out infinite; transform-origin:40px 60px; }
  .seq-moonwalk .arm-r { animation:mw-arm-r .8s ease-in-out infinite; transform-origin:150px 60px; }
  @keyframes mw-arm-l { 0%{transform:rotate(16deg);} 50%{transform:rotate(-10deg);} 100%{transform:rotate(16deg);} }
  @keyframes mw-arm-r { 0%{transform:rotate(-10deg);} 50%{transform:rotate(16deg);} 100%{transform:rotate(-10deg);} }

  .seq-spin { animation:spin-360 1.2s cubic-bezier(.4,0,.2,1) 2; }
  @keyframes spin-360 { from { transform:rotate(0);} to { transform:rotate(360deg);} }
  .seq-spin .arm-l { transform:rotate(-160deg) translateY(-30px); transform-origin:40px 60px; }
  .seq-spin .arm-r { transform:rotate(160deg) translateY(-30px); transform-origin:150px 60px; }
  .seq-spin .leg-l { transform:rotate(-30deg); transform-origin:74px 132px; }
  .seq-spin .leg-r { transform:rotate(30deg); transform-origin:110px 132px; }

  .seq-lean { animation:lean-45 2.4s ease-in-out; }
  @keyframes lean-45 { 0%{transform:rotate(0);} 18%{transform:rotate(-14deg);} 32%{transform:rotate(-32deg);} 42%{transform:rotate(-45deg);} 62%{transform:rotate(-45deg);} 78%{transform:rotate(-20deg);} 100%{transform:rotate(0);} }

  .seq-tiptoe { animation:tiptoe-bounce 2.2s ease-in-out; }
  @keyframes tiptoe-bounce { 0%,100%{transform:translateY(0);} 12%{transform:translateY(-10px);} 22%{transform:translateY(0);} 38%{transform:translateY(-10px);} 48%{transform:translateY(0);} 64%{transform:translateY(-14px);} 74%{transform:translateY(-2px);} 84%{transform:translateY(-16px);} }
  .seq-tiptoe .leg-l { transform:scaleY(.72); transform-origin:74px 132px; }
  .seq-tiptoe .leg-r { transform:scaleY(.72); transform-origin:110px 132px; }
  .seq-tiptoe .arm-r { transform:rotate(140deg) translateY(-18px); transform-origin:150px 60px; }

  .seq-pose { animation:pose-final 3s ease-in-out infinite; }
  @keyframes pose-final { 0%,100%{transform:rotate(-6deg) translateY(0);} 50%{transform:rotate(-6deg) translateY(-6px);} }
  .seq-pose .leg-l { transform:scaleY(.55); transform-origin:74px 132px; }
  .seq-pose .leg-r { transform:scaleY(.55); transform-origin:110px 132px; }
  .seq-pose .arm-r { transform:rotate(-30deg) translate(-6px,-4px); transform-origin:150px 60px; }

  /* 被花砸中：抖动 */
  .seq-hit { animation:get-hit .8s ease; }
  @keyframes get-hit { 0%,100%{transform:rotate(-6deg) translateY(0);} 20%{transform:rotate(4deg) translateY(-8px);} 40%{transform:rotate(-9deg) translateY(-3px);} 60%{transform:rotate(5deg) translateY(-5px);} 80%{transform:rotate(-4deg) translateY(-1px);} }

  /* ════ 表情系统（眼/眉/嘴 组合） ════ */
  .face .fx { opacity:0; }
  .face .base { opacity:1; }
  /* 眼睛变体 */
  .fx-eye-happy { opacity:0; }
  .face-happy .fx-eye-happy { opacity:1; }
  .face-happy .fx-eye-normal, .face-happy .fx-eye-shock, .face-happy .fx-eye-star, .face-happy .fx-eye-spiral, .face-happy .fx-eye-wobble { opacity:0 !important; }
  .fx-eye-shock { opacity:0; }
  .face-shock .fx-eye-shock { opacity:1; }
  .face-shock .fx-eye-normal, .face-shock .fx-eye-happy, .face-shock .fx-eye-star, .face-shock .fx-eye-spiral, .face-shock .fx-eye-wobble { opacity:0 !important; }
  .fx-eye-star { opacity:0; }
  .face-star .fx-eye-star { opacity:1; }
  .face-star .fx-eye-normal, .face-star .fx-eye-happy, .face-star .fx-eye-shock, .face-star .fx-eye-spiral, .face-star .fx-eye-wobble { opacity:0 !important; }
  .fx-eye-spiral { opacity:0; }
  .face-dizzy .fx-eye-spiral { opacity:1; }
  .face-dizzy .fx-eye-normal, .face-dizzy .fx-eye-happy, .face-dizzy .fx-eye-shock, .face-dizzy .fx-eye-star, .face-dizzy .fx-eye-wobble { opacity:0 !important; }
  .fx-eye-wobble { opacity:0; }
  .face-hit .fx-eye-wobble { opacity:1; }
  .face-hit .fx-eye-normal, .face-hit .fx-eye-happy, .face-hit .fx-eye-shock, .face-hit .fx-eye-star, .face-hit .fx-eye-spiral { opacity:0 !important; }

  /* 眉毛 */
  .fx-brow-raise, .fx-brow-angry { opacity:0; }
  .face-cool .fx-brow-raise { opacity:1; }
  .face-hit .fx-brow-angry { opacity:1; }
  .face-hit .fx-brow-raise { opacity:0; }

  /* 嘴变体 */
  .fx-mouth-pout, .fx-mouth-wry, .fx-mouth-o { opacity:0; }
  .face-happy .fx-mouth-pout { opacity:1; }
  .face-happy .fx-mouth-smile { opacity:0; }
  .face-smug .fx-mouth-wry { opacity:1; }
  .face-smug .fx-mouth-smile { opacity:0; }
  .face-shock .fx-mouth-o { opacity:1; }
  .face-shock .fx-mouth-smile { opacity:0; }
  .face-dizzy .fx-mouth-wry { opacity:1; }
  .face-dizzy .fx-mouth-smile { opacity:0; }
  .face-hit .fx-mouth-o { opacity:1; }
  .face-hit .fx-mouth-smile { opacity:0; }
  .face-star .fx-mouth-pout { opacity:1; }
  .face-star .fx-mouth-smile { opacity:0; }

  /* 脸红/汗 */
  .fx-blush, .fx-sweat { opacity:0; transition:opacity .3s; }
  .face-blush .fx-blush { opacity:.55; }
  .face-hit .fx-sweat { opacity:1; }

  /* 眩晕星星环绕 */
  .dizzy-star { position:absolute; font-size:15px; opacity:0; z-index:4; }
  .face-dizzy ~ .dizzy-star, #zero.face-dizzy .dizzy-star { opacity:1; }
  .dizzy-star.ds1 { animation:orbit 1.1s linear infinite; }
  .dizzy-star.ds2 { animation:orbit 1.1s linear infinite reverse; font-size:11px; }
  @keyframes orbit { 0%{transform:rotate(0) translateX(52px) rotate(0);} 100%{transform:rotate(360deg) translateX(52px) rotate(-360deg);} }

  /* 爱心（害羞） */
  .love { position:absolute; font-size:17px; opacity:0; z-index:4; }
  .face-blush .love { animation:love-pop 1.4s ease-in-out infinite; }
  @keyframes love-pop { 0%,100%{opacity:0; transform:translateY(0) scale(.7);} 30%{opacity:1; transform:translateY(-8px) scale(1.15);} 60%{opacity:.8;} }

  /* 音符/彩带/花 */
  .note { position:absolute; font-size:20px; opacity:0; z-index:2; }
  .stage.perf .note { animation:note-float 1.8s ease-out infinite; }
  .note.n1 { left:16%; top:60%; animation-delay:.2s; } .note.n2 { left:78%; top:52%; animation-delay:.7s; }
  .note.n3 { left:24%; top:30%; animation-delay:1.1s; } .note.n4 { left:66%; top:70%; animation-delay:1.4s; }
  @keyframes note-float { 0%{opacity:0; transform:translateY(0) scale(.6);} 25%{opacity:.9;} 100%{opacity:0; transform:translateY(-70px) scale(1.15) rotate(12deg);} }

  .confetti { position:absolute; top:-30px; width:9px; height:16px; border-radius:2px; opacity:0; z-index:2; }
  .stage.perf .confetti { animation:confetti-fall 4s linear infinite; }
  .confetti.c1 { left:12%; background:#ffd166; animation-delay:0s; } .confetti.c2 { left:28%; background:#7dffa8; animation-delay:1.2s; }
  .confetti.c3 { left:44%; background:#ff6b6b; animation-delay:.5s; } .confetti.c4 { left:58%; background:#8ab4ff; animation-delay:1.8s; }
  .confetti.c5 { left:70%; background:#ff2bd6; animation-delay:.9s; } .confetti.c6 { left:84%; background:#ffd166; animation-delay:1.5s; }
  .confetti.c7 { left:20%; background:#8ab4ff; animation-delay:2.3s; } .confetti.c8 { left:66%; background:#7dffa8; animation-delay:2.8s; }
  .confetti.c9 { left:38%; background:#ff2bd6; animation-delay:3.2s; } .confetti.c10 { left:90%; background:#ff6b6b; animation-delay:2s; }
  @keyframes confetti-fall { 0%{opacity:0; transform:translateY(0) rotate(0);} 10%{opacity:.95;} 50%{transform:translateY(210px) rotate(320deg);} 75%{transform:translateY(330px) rotate(600deg);} 100%{opacity:0; transform:translateY(440px) rotate(760deg);} }

  .flower { position:absolute; bottom:70px; font-size:26px; opacity:0; z-index:2; }
  .stage.throw-flowers .flower { animation:flower-throw 2.2s cubic-bezier(.3,.7,.5,1) forwards; }
  .flower.f1 { left:6%; animation-delay:0s; } .flower.f2 { right:8%; animation-delay:.35s; }
  .flower.f3 { left:12%; animation-delay:.7s; } .flower.f4 { right:14%; animation-delay:1.05s; }
  .flower.f5 { left:3%; animation-delay:1.4s; } .flower.f6 { right:4%; animation-delay:1.75s; }
  @keyframes flower-throw { 0%{opacity:0; transform:translate(0,40px) rotate(0) scale(.5);} 12%{opacity:1;} 55%{transform:translate(60px,-170px) rotate(160deg) scale(1);} 75%{transform:translate(100px,-90px) rotate(240deg) scale(1);} 100%{opacity:.9; transform:translate(130px,0px) rotate(320deg) scale(.95);} }
  .stage.throw-flowers .flower.f2, .stage.throw-flowers .flower.f4, .stage.throw-flowers .flower.f6 { animation-name:flower-throw-l; }
  @keyframes flower-throw-l { 0%{opacity:0; transform:translate(0,40px) rotate(0) scale(.5);} 12%{opacity:1;} 55%{transform:translate(-60px,-170px) rotate(-160deg) scale(1);} 75%{transform:translate(-100px,-90px) rotate(-240deg) scale(1);} 100%{opacity:.9; transform:translate(-130px,0px) rotate(-320deg) scale(.95);} }
  .flower-landed { position:absolute; bottom:46px; font-size:24px; z-index:1; opacity:0; transition:opacity .4s; }

  /* 砸头的花 */
  .flower-bonk { position:absolute; bottom:230px; left:50%; margin-left:-14px; font-size:28px; opacity:0; z-index:5; }
  .stage.bonk .flower-bonk { animation:bonk-drop .45s cubic-bezier(.5,0,1,.6) forwards; }
  @keyframes bonk-drop { 0%{opacity:1; transform:translateY(-60px) rotate(0);} 100%{opacity:1; transform:translateY(60px) rotate(180deg);} }

  .controls { display:flex; gap:14px; margin-top:24px; align-items:center; }
  .btn { padding:12px 34px; border-radius:12px; border:none; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-primary { background:#ffd166; color:#0e0e18; }
  .btn-ghost { background:rgba(255,255,255,.1); color:#ddd; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .status { margin-top:16px; font-size:14px; color:#ffd166; min-height:22px; text-align:center; letter-spacing:1px; }
  .timeline { margin-top:8px; font-size:11px; color:#555; text-align:center; line-height:1.9; max-width:720px; }
</style>
</head>
<body>

<h1>⬡ 零 · MJ 舞蹈 v9.3（表情大师）</h1>
<div class="sub">MJ 的表情管理：挑眉 → 陶醉 → 瞪眼 → 眩晕 → 惊吓 → 得意 → 耍酷 → 被花砸 → 害羞</div>

<div class="stage" id="stage">
  <div class="stage-lights"></div>
  <div class="spotlight"></div>
  <div class="floor"></div>
  <div class="floor-glow"></div>
  <span class="note n1">♪</span><span class="note n2">♫</span><span class="note n3">♪</span><span class="note n4">♬</span>
  <div class="confetti c1"></div><div class="confetti c2"></div><div class="confetti c3"></div><div class="confetti c4"></div>
  <div class="confetti c5"></div><div class="confetti c6"></div><div class="confetti c7"></div><div class="confetti c8"></div>
  <div class="confetti c9"></div><div class="confetti c10"></div>
  <span class="flower f1">🌹</span><span class="flower f2">🌹</span><span class="flower f3">🌺</span>
  <span class="flower f4">🌷</span><span class="flower f5">💐</span><span class="flower f6">🌼</span>
  <span class="flower-landed" id="landed1" style="left:44%">🌹</span>
  <span class="flower-landed" id="landed2" style="left:48%">🌺</span>
  <span class="flower-landed" id="landed3" style="left:52%">🌷</span>
  <span class="flower-landed" id="landed4" style="left:56%">🌼</span>
  <span class="flower-landed" id="landed5" style="left:40%">💐</span>
  <span class="flower-bonk">🌹</span>

  <div id="zero" class="face-normal">
    <span class="dizzy-star ds1" style="left:60%; top:14%;">⭐</span>
    <span class="dizzy-star ds2" style="left:30%; top:6%;">✨</span>
    <span class="love" style="left:55%; top:8%;">💚</span>
    <span class="love" style="left:36%; top:2%;">💚</span>
    <svg class="zero-svg" width="200" height="200" viewBox="0 0 190 190">
      <g class="p-part arm-l"><rect x="36" y="54" width="15" height="46" rx="7.5" fill="#2a2a3e"/></g>
      <g class="p-part arm-r">
        <rect x="139" y="54" width="15" height="46" rx="7.5" fill="#2a2a3e"/>
        <rect x="135" y="90" width="23" height="18" rx="9" fill="#eaeaea"/>
      </g>
      <g class="p-part leg-l"><rect x="66" y="124" width="18" height="36" rx="9" fill="#2a2a3e"/></g>
      <g class="p-part leg-r"><rect x="106" y="124" width="18" height="36" rx="9" fill="#2a2a3e"/></g>
      <g class="p-part body-tilt">
        <rect x="40" y="26" width="110" height="112" rx="34" fill="#1c1c2e" stroke="#ffd166" stroke-width="3"/>
        <circle cx="60" cy="48" r="2" fill="#ffd166" opacity=".6"/><circle cx="130" cy="42" r="2" fill="#ffd166" opacity=".6"/>
        <circle cx="80" cy="38" r="1.5" fill="#ffd166" opacity=".5"/><circle cx="112" cy="50" r="1.5" fill="#ffd166" opacity=".5"/>

        <!-- ═══ 表情层 ═══ -->
        <g class="face">
          <!-- 正常眼（基础） -->
          <g class="fx fx-eye-normal base">
            <ellipse cx="76" cy="72" rx="12" ry="10" fill="#eaeaea"/>
            <ellipse cx="114" cy="72" rx="12" ry="10" fill="#eaeaea"/>
            <circle cx="79" cy="70" r="4" fill="#12121e"/>
            <circle cx="117" cy="70" r="4" fill="#12121e"/>
            <circle cx="82" cy="66" r="1.7" fill="#fff"/>
            <circle cx="120" cy="66" r="1.7" fill="#fff"/>
          </g>
          <!-- 陶醉眯眼 -->
          <g class="fx fx-eye-happy">
            <path d="M64 74 Q76 66 88 74" stroke="#eaeaea" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M102 74 Q114 66 126 74" stroke="#eaeaea" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          </g>
          <!-- 惊吓瞪眼 -->
          <g class="fx fx-eye-shock">
            <ellipse cx="76" cy="72" rx="14" ry="13" fill="#eaeaea"/>
            <ellipse cx="114" cy="72" rx="14" ry="13" fill="#eaeaea"/>
            <circle cx="76" cy="72" r="5" fill="#12121e"/>
            <circle cx="114" cy="72" r="5" fill="#12121e"/>
            <circle cx="73" cy="68" r="2" fill="#fff"/>
            <circle cx="111" cy="68" r="2" fill="#fff"/>
          </g>
          <!-- 星星眼 -->
          <g class="fx fx-eye-star">
            <path d="M76 60 L79 68 L88 68 L81 73 L83 82 L76 77 L69 82 L71 73 L64 68 L73 68 Z" fill="#ffd166"/>
            <path d="M114 60 L117 68 L126 68 L119 73 L121 82 L114 77 L107 82 L109 73 L102 68 L111 68 Z" fill="#ffd166"/>
          </g>
          <!-- 眩晕 @@ -->
          <g class="fx fx-eye-spiral">
            <circle cx="76" cy="72" r="9" fill="#eaeaea"/>
            <circle cx="114" cy="72" r="9" fill="#eaeaea"/>
            <path d="M72 68 q4 -4 8 0 q-4 4 -8 0" stroke="#12121e" stroke-width="2" fill="none"/>
            <path d="M110 68 q4 -4 8 0 q-4 4 -8 0" stroke="#12121e" stroke-width="2" fill="none"/>
          </g>
          <!-- 被砸 > < -->
          <g class="fx fx-eye-wobble">
            <path d="M64 72 L82 64 L82 80 Z" fill="#eaeaea"/>
            <path d="M108 64 L126 72 L108 80 Z" fill="#eaeaea"/>
            <circle cx="76" cy="72" r="2.5" fill="#12121e"/>
            <circle cx="114" cy="72" r="2.5" fill="#12121e"/>
          </g>
          <!-- 眉毛：正常 -->
          <path class="fx fx-brow-normal base" d="M62 54 Q76 48 90 54" stroke="#2a2a3e" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path class="fx fx-brow-normal base" d="M100 54 Q114 48 128 54" stroke="#2a2a3e" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- 挑眉（耍酷） -->
          <path class="fx fx-brow-raise" d="M62 52 Q76 44 90 50" stroke="#2a2a3e" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path class="fx fx-brow-raise" d="M100 50 Q114 44 128 52" stroke="#2a2a3e" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- 八字眉（被砸） -->
          <path class="fx fx-brow-angry" d="M62 52 Q76 58 90 52" stroke="#2a2a3e" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path class="fx fx-brow-angry" d="M100 52 Q114 58 128 52" stroke="#2a2a3e" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- 嘴：微笑（基础） -->
          <path class="fx fx-mouth-smile base" d="M84 100 Q95 93 106 100" stroke="#eaeaea" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- 抿嘴（陶醉） -->
          <path class="fx fx-mouth-pout" d="M86 100 Q95 104 104 100" stroke="#eaeaea" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- 歪嘴（得意） -->
          <path class="fx fx-mouth-wry" d="M82 97 Q95 94 110 101" stroke="#eaeaea" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- O型嘴（惊吓） -->
          <ellipse class="fx fx-mouth-o" cx="95" cy="101" rx="8" ry="9" fill="#12121e" stroke="#eaeaea" stroke-width="2.5"/>
          <!-- 脸红 -->
          <ellipse class="fx fx-blush" cx="64" cy="92" rx="11" ry="6" fill="#ff6b9d"/>
          <ellipse class="fx fx-blush" cx="126" cy="92" rx="11" ry="6" fill="#ff6b9d"/>
          <!-- 汗滴 -->
          <path class="fx fx-sweat" d="M140 52 q6 8 0 12 q-6 -4 0 -12" fill="#8ab4ff"/>
        </g>
        <!-- 礼帽 -->
        <g class="p-part hat">
          <ellipse cx="95" cy="34" rx="42" ry="10" fill="#0a0a12"/>
          <rect x="62" y="6" width="66" height="30" rx="6" fill="#0a0a12"/>
          <rect x="62" y="30" width="66" height="6" fill="#1a1a24"/>
          <rect x="62" y="24" width="66" height="5" fill="#d9643a"/>
        </g>
      </g>
    </svg>
  </div>
</div>

<div class="controls">
  <button class="btn btn-primary" id="btnStart" onclick="startShow()">🎤 演出开始！</button>
  <button class="btn btn-ghost" id="btnReplay" onclick="startShow()" disabled>再看一次</button>
</div>
<div class="status" id="status">等待演出…</div>
<div class="timeline">出场(挑眉) → 月球漫步(陶醉抿嘴) → 旋转(瞪眼→眩晕@@) → 45°倾斜(惊吓O嘴) → 踮脚(歪嘴得意) → 定格耍酷(挑眉) → 💐被花砸中!(> <眼+汗) → 害羞脸红(星星眼+爱心)</div>

<script>
const stage = document.getElementById('stage');
const zero = document.getElementById('zero');
const statusEl = document.getElementById('status');
const btnStart = document.getElementById('btnStart');
const btnReplay = document.getElementById('btnReplay');
let running = false;
let timers = [];

function scheduleAt(ms, fn) { timers.push(setTimeout(fn, ms)); }

function setFace(face) {
  zero.className = zero.className.replace(/face-\w+/g, '').trim();
  if (face) zero.classList.add('face-' + face);
}
function setStep(cls, face, text) {
  zero.className = '';
  void zero.offsetWidth;
  zero.classList.add(cls);
  setFace(face);
  if (text) statusEl.textContent = text;
}

function startShow() {
  if (running) return;
  running = true;
  btnStart.disabled = true; btnReplay.disabled = true;
  timers.forEach(clearTimeout); timers = [];
  stage.classList.remove('throw-flowers', 'bonk');
  document.querySelectorAll('.flower-landed').forEach(f => f.style.opacity = 0);

  stage.classList.add('lights-on');
  scheduleAt(600, () => stage.classList.add('perf'));

  // 时间轴 + 表情
  scheduleAt(0,    () => setStep('seq-enter', 'cool',    '🎩 出场 — 挑眉耍酷'));
  scheduleAt(1300, () => setStep('seq-moonwalk', 'happy', '🕺 月球漫步 — 陶醉抿嘴'));
  scheduleAt(4700, () => setStep('seq-spin', 'shock',   '💫 旋转 — 瞪眼！'));
  scheduleAt(6200, () => setStep('seq-spin', 'dizzy',   '🌀 转晕了…@@'));
  scheduleAt(7100, () => setStep('seq-lean', 'shock',   '🕴️ 45° 倾斜 — 吓得O嘴'));
  scheduleAt(9500, () => setStep('seq-tiptoe', 'smug',  '🩰 踮脚 — 得意歪嘴'));
  scheduleAt(11700, () => {
    setStep('seq-pose', 'cool', '🌟 定格 — 耍酷中，观众丢花！');
    stage.classList.add('throw-flowers');
    ['landed1','landed2','landed3','landed4','landed5'].forEach((id, i) => {
      scheduleAt(12700 + i * 400, () => document.getElementById(id).style.opacity = .85);
    });
  });
  // 💐 花砸头！（搞怪高潮）
  scheduleAt(13000, () => {
    setStep('seq-hit', 'hit', '💥 一朵花砸头上了！');
    stage.classList.add('bonk');
  });
  scheduleAt(13900, () => {
    stage.classList.remove('bonk');
    setStep('seq-pose', 'blush', '😳 害羞脸红 — 星星眼 + 爱心');
  });
  scheduleAt(16200, () => {
    statusEl.textContent = '👏 谢谢！Bravo！— 可以"再看一次"';
    btnReplay.disabled = false; running = false;
  });
}
</script>

</body>
</html>

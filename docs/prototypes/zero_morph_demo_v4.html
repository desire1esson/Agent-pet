<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>零 · HD2D 赛博像素小人（变身 v4）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; background:#0e0e18; color:#eaeaea; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:30px; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:#888; font-size:13px; margin-bottom:22px; }

  .stage { width:500px; height:500px; background:radial-gradient(circle at 50% 42%, #13132a, #08080f); border-radius:20px; border:1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  svg { display:block; }

  .controls { display:flex; gap:14px; margin-top:22px; }
  .btn { padding:12px 30px; border-radius:12px; border:none; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-primary { background:#00fff7; color:#0e0e18; }
  .btn-ghost { background:rgba(255,255,255,.1); color:#ddd; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .status { margin-top:14px; font-size:13px; color:#888; min-height:22px; text-align:center; }
  .timeline { margin-top:8px; font-size:11px; color:#555; max-width:440px; text-align:center; line-height:1.8; }

  /* Q版萌物（v2 设计，矢量圆角） */
  .q-part { transition: all .3s ease; }
  .exploding .q-body, .exploding .q-eye, .exploding .q-mouth { opacity:0; transform:scale(1.2); }
  .exploding .q-leg-l { opacity:0; transform:translate(-26px,18px) rotate(-28deg); }
  .exploding .q-leg-r { opacity:0; transform:translate(26px,18px) rotate(28deg); }
  .exploding .q-arm-l { opacity:0; transform:rotate(150deg) translate(-8px,-16px); }
  .exploding .q-arm-r { opacity:0; transform:rotate(-150deg) translate(8px,-16px); }

  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  .exploding .flash { animation: flash-blink .45s ease .2s 2; }
  @keyframes flash-blink { 0%{opacity:0;} 25%{opacity:.9;} 50%{opacity:0;} 100%{opacity:0;} }

  .eyecharge { position:absolute; width:130px; height:130px; left:50%; top:42%; margin-left:-65px; margin-top:-65px; border-radius:50%; opacity:0; background:radial-gradient(circle, rgba(0,255,247,.55), transparent 70%); }
  .exploding .eyecharge { animation: charge .5s ease .05s forwards; }
  @keyframes charge { 0%{opacity:0; transform:scale(.3);} 60%{opacity:.9;} 100%{opacity:0; transform:scale(1.5);} }

  .shake { animation:none; }
  .exploding .shake { animation: body-shake .4s ease .15s; }
  @keyframes body-shake { 0%,100%{transform:translate(0);} 20%{transform:translate(-3px,1px);} 40%{transform:translate(3px,-1px);} 60%{transform:translate(-2px,-1px);} 80%{transform:translate(2px,1px);} }

  /* HD2D 像素粒子 */
  .px { opacity:0; transition: transform .34s cubic-bezier(.2,.75,.25,1.2), opacity .1s ease; }
  .cyborg .px { opacity:1; transform: translate(0,0) !important; }

  .burst { position:absolute; width:400px; height:400px; border-radius:50%; opacity:0; pointer-events:none; background:radial-gradient(circle, rgba(0,255,247,.5), rgba(255,0,230,.12) 45%, transparent 70%); }
  .cyborg .burst { animation: burst-out .6s ease 1s forwards; }
  @keyframes burst-out { 0%{opacity:0; transform:scale(.2);} 30%{opacity:1;} 100%{opacity:0; transform:scale(2.4);} }

  .ring { position:absolute; width:250px; height:250px; border:2px solid rgba(0,255,247,.65); border-radius:50%; opacity:0; }
  .cyborg .ring { animation: ring-out .7s ease .95s forwards; }
  @keyframes ring-out { 0%{opacity:0; transform:scale(.3);} 40%{opacity:.9;} 100%{opacity:0; transform:scale(1.9);} }

  .finish-glow { position:absolute; inset:-30px; background:radial-gradient(circle at 50% 42%, rgba(0,255,247,.22), transparent 60%); opacity:0; pointer-events:none; transition:opacity .6s 1.1s; }
  .cyborg .finish-glow { opacity:.5; }

  /* 像素霓虹呼吸 + 屏幕扫描线 */
  .cyborg .px-glow { animation: pixel-breathe 2.6s ease-in-out infinite; }
  @keyframes pixel-breathe { 0%,100%{filter:drop-shadow(0 0 2px rgba(0,255,247,.4));} 50%{filter:drop-shadow(0 0 8px rgba(0,255,247,.85));} }
  .scanlines { position:absolute; inset:0; pointer-events:none; opacity:0; background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.18) 3px 4px); }
  .cyborg .scanlines { opacity:.6; transition:opacity .5s 1.2s; }

  /* 反差彩蛋 */
  .derp .px { animation: pixel-sneeze .5s ease; }
  @keyframes pixel-sneeze { 0%,100%{transform:translate(0);} 20%{transform:translate(-2px,-3px);} 40%{transform:translate(2px,-2px);} 60%{transform:translate(-1px,1px);} 80%{transform:translate(1px,1px);} }
  .derp .px-eye-cyborg { opacity:0 !important; }
  .px-eye-cyborg { transition:opacity .2s; }
  .derp .px-eye-round { opacity:1 !important; }
  .px-eye-round { opacity:0; }
  .derp-bubble { position:absolute; top:64px; left:calc(50% + 44px); background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); padding:6px 12px; border-radius:14px; font-size:13px; color:#00fff7; opacity:0; transform:translateY(6px); }
  .derp .derp-bubble { animation: pop-in .35s ease 1.15s forwards; }
  @keyframes pop-in { to { opacity:1; transform:translateY(0);} }
  .glitch { position:absolute; inset:0; pointer-events:none; opacity:0; background:linear-gradient(transparent 30%, rgba(0,255,247,.12) 30%, rgba(0,255,247,.12) 33%, transparent 33%, transparent 66%, rgba(255,0,230,.12) 66%, rgba(255,0,230,.12) 70%, transparent 70%); }
  .derp .glitch { animation: glitch-flicker .4s steps(2) .15s 3; }
  @keyframes glitch-flicker { 0%{opacity:0;} 50%{opacity:.3;} 100%{opacity:0;} }
</style>
</head>
<body>

<h1>⬡ 零 · HD2D 赛博像素小人 v4</h1>
<div class="sub">矢量萌物 ⚡ 像素粒子聚合 ⚡ 高清赛博像素小人（3px 像素单元 · 五阶光影 · 护目镜发光眼）</div>

<div class="stage" id="stage">
  <div class="scanlines"></div>
  <div class="finish-glow"></div>
  <div class="burst"></div>
  <div class="ring"></div>
  <div class="flash"></div>
  <div class="eyecharge"></div>
  <div class="glitch"></div>
  <div class="derp-bubble">阿嚏！…像素都飞了。</div>

  <svg id="svgRoot" width="450" height="450" viewBox="0 0 220 220">
    <!-- ═══ Q版萌物（日常形态，v2 设计） ═══ -->
    <g id="qGroup" class="shake">
      <g class="q-part">
        <rect class="q-leg-l" x="60" y="118" width="16" height="30" rx="8" fill="#2a2a3e"/>
        <rect class="q-leg-r" x="144" y="118" width="16" height="30" rx="8" fill="#2a2a3e"/>
        <g class="q-arm-l"><rect x="34" y="40" width="14" height="44" rx="7" fill="#2a2a3e"/></g>
        <g class="q-arm-r"><rect x="172" y="40" width="14" height="44" rx="7" fill="#2a2a3e"/></g>
        <rect class="q-body" x="42" y="26" width="136" height="136" rx="42" fill="#1c1c2e" stroke="#7dffa8" stroke-width="3"/>
        <g class="q-eye">
          <ellipse cx="74" cy="72" rx="11" ry="10" fill="#eaeaea"/>
          <ellipse cx="146" cy="72" rx="11" ry="10" fill="#eaeaea"/>
          <circle cx="77" cy="70" r="4" fill="#12121e"/>
          <circle cx="149" cy="70" r="4" fill="#12121e"/>
          <circle cx="80" cy="66" r="1.6" fill="#fff"/>
          <circle cx="152" cy="66" r="1.6" fill="#fff"/>
        </g>
        <path class="q-mouth" d="M98 100 Q110 94 122 100" stroke="#eaeaea" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ═══ HD2D 像素小人（JS 生成） ═══ -->
    <g id="pixelGroup"></g>
  </svg>
</div>

<div class="controls">
  <button class="btn btn-primary" id="btnMorph" onclick="morph()">⚡ 变身！</button>
  <button class="btn btn-ghost" id="btnRevert" onclick="revert()" disabled>变回去</button>
</div>
<div class="status" id="status">形态：Q版萌物 · 日常</div>
<div class="timeline">变身序列：眼闪蓄力 → 震动爆闪 → 萌物四散 → 像素粒子聚合(0.3-1.7s) → 霓虹定格 → 酷3秒 → 像素喷嚏彩蛋</div>

<script>
// ═══════════ HD2D 像素图案 ═══════════
// 颜色阶（五阶光影 + 点缀）：
// . 空  K #12121e 暗底 1 #0f4f4a 深青 2 #00c9bd 中青 3 #00fff7 亮青
// 4 #eafff3 高光  M #ff00e6 品红  P #800073 暗品红  W #ffffff
const COLORS = {
  '.': null, 'K': '#12121e', '1': '#0f4f4a', '2': '#00c9bd',
  '3': '#00fff7', '4': '#eafff3', 'M': '#ff00e6', 'P': '#800073', 'W': '#ffffff'
};
const PX = 3;

// 头部（16列 x 12行）：发光护目镜 + 天线 + 细节
const HEAD = [
  "......KKKK......",
  "..K..K2222K..K..",
  "..KK.K2222K.KK..",
  "...KK222222KK...",
  "..KK22333322KK..",
  "..K2K344443K2K..",
  "..K2K344443K2K..",
  "..KK22333322KK..",
  "...KK222222KK...",
  "...K22M22M22K...",
  "....K222222K....",
  ".....KKKKKK.....",
];
// 身体（20列 x 14行）：装甲分层 + 品红电路 + 腰带
const BODY = [
  "KKKKKKKKKKKKKKKKKKKK",
  "K111111111111111111K",
  "K122222222222222221K",
  "K123333333333333321K",
  "K12333M333333M33321K",
  "K123333333333333321K",
  "K123333333333333321K",
  "K122222222222222221K",
  "K12KKKKKKKKKKKKKK21K",
  "K12K111111111111K21K",
  "K111111111111111111K",
  "K1PP111111111111PP1K",
  "K11KKKKKKKKKKKKKK11K",
  "KKKKKKKKKKKKKKKKKKKK",
];
// 手臂（6列 x 12行）
const ARM = [
  "KKKKKK",
  "K1111K",
  "K1221K",
  "K1231K",
  "K1231K",
  "K1231K",
  "K1231K",
  "K1221K",
  "K1M21K",
  "K1221K",
  "K1111K",
  "KKKKKK",
];
// 腿（8列 x 12行）：发光关节 + 靴
const LEG = [
  "KKKKKKKK",
  "K111111K",
  "K122221K",
  "K122221K",
  "K1K22K1K",
  "K1K22K1K",
  "K111111K",
  "K123321K",
  "K123321K",
  "K111111K",
  "K1KKKK1K",
  "KKKKKKKK",
];

// 部件布局（x, y 起点）
const LAYOUT = {
  head:  { grid: HEAD, x: 86, y: 30 },
  body:  { grid: BODY, x: 80, y: 66 },
  armL:  { grid: ARM,  x: 62, y: 66 },
  armR:  { grid: ARM,  x: 140, y: 66 },
  legL:  { grid: LEG,  x: 88, y: 112 },
  legR:  { grid: LEG,  x: 112, y: 112 },
};

function buildPixelSprite() {
  const g = document.getElementById('pixelGroup');
  const parts = Object.values(LAYOUT);
  const allPx = [];
  for (const part of parts) {
    const { grid, x, y } = part;
    grid.forEach((row, r) => {
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === '.' || ch === 'K') continue; // 边框 K 由身体内部填充，外框略过
        const color = COLORS[ch];
        if (!color) continue;
        allPx.push({ x: x + c * PX, y: y + r * PX, color, ch });
      }
    });
  }
  // 中心（用于飞入距离）
  const cx = 110, cy = 98;
  let maxDelay = 0;
  allPx.forEach(p => {
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', p.x); rect.setAttribute('y', p.y);
    rect.setAttribute('width', PX - 0.4); rect.setAttribute('height', PX - 0.4);
    rect.setAttribute('fill', p.color);
    // 眼睛像素标记（护目镜高光 → 霓虹 + 反差圆眼）
    if (p.ch === '4' && (p.x < 110)) rect.classList.add('px-eye-cyborg', 'px-glow');
    if (p.ch === '4' && (p.x >= 110)) rect.classList.add('px-eye-cyborg', 'px-glow');
    // 反差彩蛋：护目镜变圆眼（两个圆眼覆盖在眼睛位置）
    if (p.ch === '4') {
      const round = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
      const ex = p.x + PX / 2, ey = p.y + PX / 2;
      const side = ex < 110 ? -1 : 1;
      round.setAttribute('cx', ex + side * 3); round.setAttribute('cy', ey);
      round.setAttribute('rx', 5); round.setAttribute('ry', 5.5);
      round.setAttribute('fill', '#eaeaea');
      round.classList.add('px-eye-round');
      g.appendChild(round);
      const pupil = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      pupil.setAttribute('cx', ex + side * 3); pupil.setAttribute('cy', ey);
      pupil.setAttribute('r', 2.2); pupil.setAttribute('fill', '#12121e');
      pupil.classList.add('px-eye-round');
      g.appendChild(pupil);
    }
    const dist = Math.hypot(p.x - cx, p.y - cy);
    const delay = dist / 200 * 1.4 + Math.random() * 0.15;
    maxDelay = Math.max(maxDelay, delay);
    const ang = Math.atan2(p.y - cy, p.x - cx);
    const flyDist = 300 + Math.random() * 80;
    rect.style.transform = `translate(${Math.cos(ang) * flyDist}px, ${Math.sin(ang) * flyDist}px)`;
    rect.style.transitionDelay = delay + 's';
    rect.classList.add('px');
    g.appendChild(rect);
  });
  return maxDelay;
}

const stage = document.getElementById('stage');
const status = document.getElementById('status');
const btnMorph = document.getElementById('btnMorph');
const btnRevert = document.getElementById('btnRevert');
let busy = false;
buildPixelSprite();

function morph() {
  if (busy) return;
  busy = true; btnMorph.disabled = true; btnRevert.disabled = true;
  status.textContent = '变身启动…';
  stage.classList.remove('cyborg', 'derp');
  stage.classList.add('exploding');
  setTimeout(() => {
    stage.classList.remove('exploding');
    stage.classList.add('cyborg');
    status.textContent = '形态：HD2D 赛博像素小人 · 危险模式（保持3秒…）';
    btnRevert.disabled = false;
    busy = false;
    setTimeout(() => {
      if (stage.classList.contains('cyborg')) {
        stage.classList.add('derp');
        status.textContent = '…阿嚏！像素都飞了';
        setTimeout(() => {
          stage.classList.remove('derp');
          status.textContent = '形态：HD2D 赛博像素小人（像素已归位，刚才是静电）';
        }, 1900);
      }
    }, 3400);
  }, 900);
}

function revert() {
  if (busy) return;
  busy = true; btnMorph.disabled = true; btnRevert.disabled = true;
  status.textContent = '解除变身…';
  stage.classList.remove('cyborg', 'derp', 'exploding');
  setTimeout(() => {
    status.textContent = '形态：Q版萌物 · 日常（刚才那个不是我）';
    btnMorph.disabled = false;
    busy = false;
  }, 300);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>零 · 立绘桥接变身 v7（最终形象版）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; background:#0e0e18; color:#eaeaea; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:30px; }
  h1 { font-size:22px; margin-bottom:4px; }
  .sub { color:#888; font-size:13px; margin-bottom:22px; }

  .stage { width:560px; height:520px; background:radial-gradient(circle at 50% 42%, #13132a, #08080f); border-radius:20px; border:1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .stage .inner { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  svg.q-svg { position:absolute; }

  .controls { display:flex; gap:14px; margin-top:22px; }
  .btn { padding:12px 30px; border-radius:12px; border:none; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-primary { background:#00fff7; color:#0e0e18; }
  .btn-ghost { background:rgba(255,255,255,.1); color:#ddd; }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .status { margin-top:14px; font-size:13px; color:#888; min-height:22px; text-align:center; }
  .timeline { margin-top:8px; font-size:11px; color:#555; max-width:480px; text-align:center; line-height:1.8; }

  /* Q版 */
  .q-part { transition: all .3s ease; }
  .exploding .q-body, .exploding .q-eye, .exploding .q-mouth { opacity:0; transform:scale(1.2); }
  .exploding .q-leg-l { opacity:0; transform:translate(-26px,18px) rotate(-28deg); }
  .exploding .q-leg-r { opacity:0; transform:translate(26px,18px) rotate(28deg); }
  .exploding .q-arm-l { opacity:0; transform:rotate(150deg) translate(-8px,-16px); }
  .exploding .q-arm-r { opacity:0; transform:rotate(-150deg) translate(8px,-16px); }

  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:5; }
  .exploding .flash { animation: flash-blink .45s ease .15s 2; }
  @keyframes flash-blink { 0%{opacity:0;} 25%{opacity:.9;} 50%{opacity:0;} 100%{opacity:0;} }
  .eyecharge { position:absolute; width:150px; height:150px; left:50%; top:42%; margin-left:-75px; margin-top:-75px; border-radius:50%; opacity:0; background:radial-gradient(circle, rgba(0,255,247,.55), transparent 70%); z-index:4; }
  .exploding .eyecharge { animation: charge .5s ease .05s forwards; }
  @keyframes charge { 0%{opacity:0; transform:scale(.3);} 60%{opacity:.9;} 100%{opacity:0; transform:scale(1.5);} }
  .shake { animation:none; }
  .exploding .shake { animation: body-shake .4s ease .15s; }
  @keyframes body-shake { 0%,100%{transform:translate(0);} 20%{transform:translate(-3px,1px);} 40%{transform:translate(3px,-1px);} 60%{transform:translate(-2px,-1px);} 80%{transform:translate(2px,1px);} }

  /* 能量粒子（汇聚） */
  .particle { position:absolute; width:7px; height:7px; border-radius:1.5px; opacity:0; pointer-events:none; z-index:3; transition: transform 1.15s cubic-bezier(.4,.05,.2,1), opacity .15s ease; }
  .exploding .particle { opacity:1; transform: translate(0,0) !important; }
  .particle.p-magenta { background:#ff2bd6; box-shadow:0 0 8px #ff2bd6; }
  .particle.p-cyan { background:#00fff7; box-shadow:0 0 8px #00fff7; }
  .particle.p-white { background:#ffffff; box-shadow:0 0 6px #ffffff; }

  /* 汇聚爆闪（粒子聚齐瞬间） */
  .core-flash { position:absolute; width:60px; height:60px; left:50%; top:46%; margin-left:-30px; margin-top:-30px; border-radius:50%; background:radial-gradient(circle, #fff, rgba(0,255,247,.8) 40%, transparent 70%); opacity:0; z-index:6; pointer-events:none; }
  .exploding .core-flash { animation: core-bang .3s ease 1.05s forwards; }
  @keyframes core-bang { 0%{opacity:0; transform:scale(.3);} 50%{opacity:1;} 100%{opacity:0; transform:scale(2);} }

  /* 立绘 */
  #art {
    position:absolute; opacity:0; transform:scale(.55); z-index:2;
    transition: transform .45s cubic-bezier(.2,.9,.3,1.3), opacity .2s ease;
    filter: drop-shadow(0 0 24px rgba(0,255,247,.35));
    pointer-events:none;
  }
  .cyborg #art { opacity:1; transform:scale(1); }
  .cyborg #art .art-inner { animation: art-breathe 2.8s ease-in-out infinite; }
  @keyframes art-breathe { 0%,100%{ filter:drop-shadow(0 0 14px rgba(0,255,247,.3)); } 50%{ filter:drop-shadow(0 0 34px rgba(0,255,247,.75)); } }

  .burst { position:absolute; width:440px; height:440px; border-radius:50%; opacity:0; pointer-events:none; z-index:1; background:radial-gradient(circle, rgba(0,255,247,.5), rgba(255,0,230,.12) 45%, transparent 70%); }
  .cyborg .burst { animation: burst-out .6s ease .4s forwards; }
  @keyframes burst-out { 0%{opacity:0; transform:scale(.2);} 30%{opacity:1;} 100%{opacity:0; transform:scale(2.3);} }
  .ring { position:absolute; width:280px; height:280px; border:2px solid rgba(0,255,247,.65); border-radius:50%; opacity:0; z-index:1; }
  .cyborg .ring { animation: ring-out .7s ease .35s forwards; }
  @keyframes ring-out { 0%{opacity:0; transform:scale(.3);} 40%{opacity:.9;} 100%{opacity:0; transform:scale(1.8);} }
  .scanlines { position:absolute; inset:0; pointer-events:none; opacity:0; background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.18) 3px 4px); z-index:7; }
  .cyborg .scanlines { opacity:.55; transition:opacity .5s .5s; }

  /* 彩蛋 */
  .derp #art { animation: art-sneeze .5s ease; }
  @keyframes art-sneeze { 0%,100%{transform:scale(1);} 20%{transform:scale(.97) translate(-4px,-3px);} 40%{transform:scale(.95) translate(4px,-2px) rotate(-1.5deg);} 60%{transform:scale(.97) translate(-2px,1px);} 80%{transform:scale(1.01) translate(2px,1px);} }
  .derp-bubble { position:absolute; top:36px; left:calc(50% + 60px); background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); padding:6px 12px; border-radius:14px; font-size:13px; color:#00fff7; opacity:0; transform:translateY(6px); z-index:8; }
  .derp .derp-bubble { animation: pop-in .35s ease 1.05s forwards; }
  @keyframes pop-in { to { opacity:1; transform:translateY(0);} }
  .glitch { position:absolute; inset:0; pointer-events:none; opacity:0; z-index:7; background:linear-gradient(transparent 30%, rgba(0,255,247,.12) 30%, rgba(0,255,247,.12) 33%, transparent 33%, transparent 66%, rgba(255,0,230,.12) 66%, rgba(255,0,230,.12) 70%, transparent 70%); }
  .derp .glitch { animation: glitch-flicker .4s steps(2) .1s 3; }
  @keyframes glitch-flicker { 0%{opacity:0;} 50%{opacity:.35;} 100%{opacity:0;} }
</style>
</head>
<body>

<h1>⬡ 零 · 立绘桥接变身 v7</h1>
<div class="sub">Q版萌物 ⚡ 能量粒子汇聚 ⚡ 立绘闪现 —— 粒子"组成"立绘的视觉魔术</div>

<div class="stage" id="stage">
  <div class="scanlines"></div>
  <div class="glitch"></div>
  <div class="burst"></div>
  <div class="ring"></div>
  <div class="eyecharge"></div>
  <div class="flash"></div>
  <div class="core-flash"></div>
  <div class="derp-bubble">阿嚏！…剑差点没握住。</div>

  <div class="inner">
    <!-- 立绘（透明 PNG） -->
    <img id="art" src="zero_assets/zero_pixel_standalone.png" alt="零·像素战士" />
    <!-- Q版萌物 -->
    <svg class="q-svg" width="380" height="380" viewBox="0 0 220 220">
      <g class="shake">
        <g class="q-part">
          <rect class="q-leg-l" x="60" y="118" width="16" height="30" rx="8" fill="#2a2a3e"/>
          <rect class="q-leg-r" x="144" y="118" width="16" height="30" rx="8" fill="#2a2a3e"/>
          <g class="q-arm-l"><rect x="34" y="40" width="14" height="44" rx="7" fill="#2a2a3e"/></g>
          <g class="q-arm-r"><rect x="172" y="40" width="14" height="44" rx="7" fill="#2a2a3e"/></g>
          <rect class="q-body" x="42" y="26" width="136" height="136" rx="42" fill="#1c1c2e" stroke="#7dffa8" stroke-width="3"/>
          <g class="q-eye">
            <ellipse cx="74" cy="72" rx="11" ry="10" fill="#eaeaea"/>
            <ellipse cx="146" cy="72" rx="11" ry="10" fill="#eaeaea"/>
            <circle cx="77" cy="70" r="4" fill="#12121e"/>
            <circle cx="149" cy="70" r="4" fill="#12121e"/>
            <circle cx="80" cy="66" r="1.6" fill="#fff"/>
            <circle cx="152" cy="66" r="1.6" fill="#fff"/>
          </g>
          <path class="q-mouth" d="M98 100 Q110 94 122 100" stroke="#eaeaea" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
  </div>
</div>

<div class="controls">
  <button class="btn btn-primary" id="btnMorph" onclick="morph()">⚡ 变身！</button>
  <button class="btn btn-ghost" id="btnRevert" onclick="revert()" disabled>变回去</button>
</div>
<div class="status" id="status">形态：Q版萌物 · 日常</div>
<div class="timeline">变身：眼闪蓄力 → 震动爆闪 → 能量粒子四周汇聚(1.15s) → 汇聚爆闪 → 立绘弹出+光爆定格 → 霓虹呼吸 → 酷3秒 → 阿嚏！(glitch+抖动)</div>

<script>
const stage = document.getElementById('stage');
const status = document.getElementById('status');
const btnMorph = document.getElementById('btnMorph');
const btnRevert = document.getElementById('btnRevert');
let busy = false;

// 生成能量粒子（分布在圆周，汇聚到中心）
function spawnParticles() {
  const N = 44;
  const colors = ['p-cyan', 'p-magenta', 'p-white', 'p-cyan', 'p-cyan', 'p-magenta'];
  const stageEl = document.getElementById('stage');
  const cx = stageEl.clientWidth / 2, cy = stageEl.clientHeight * 0.46;
  for (let i = 0; i < N; i++) {
    const p = document.createElement('div');
    p.className = 'particle ' + colors[i % colors.length];
    const ang = (i / N) * Math.PI * 2 + Math.random() * 0.15;
    const r = 210 + Math.random() * 90;
    const x = cx + Math.cos(ang) * r;
    const y = cy + Math.sin(ang) * r;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    // 目标=中心：初始 transform 从当前位置 → translate(0,0) 到中心
    p.style.transform = `translate(${(cx - x) * -1}px, ${(cy - y) * -1}px)`;
    p.style.transitionDelay = (Math.random() * 0.25) + 's';
    stageEl.appendChild(p);
  }
}
spawnParticles();

function morph() {
  if (busy) return;
  busy = true; btnMorph.disabled = true; btnRevert.disabled = true;
  status.textContent = '变身启动…';
  stage.classList.remove('cyborg', 'derp');
  stage.classList.add('exploding');
  // 粒子汇聚完成后切换立绘
  setTimeout(() => {
    stage.classList.remove('exploding');
    stage.classList.add('cyborg');
    status.textContent = '形态：像素战士零 · 危险模式（保持3秒…）';
    btnRevert.disabled = false;
    busy = false;
    // 反差彩蛋
    setTimeout(() => {
      if (stage.classList.contains('cyborg')) {
        stage.classList.add('derp');
        status.textContent = '…阿嚏！剑差点没握住';
        setTimeout(() => {
          stage.classList.remove('derp');
          status.textContent = '形态：像素战士零（剑已握稳，刚才是静电）';
        }, 1900);
      }
    }, 3400);
  }, 1500);
}

function revert() {
  if (busy) return;
  busy = true; btnMorph.disabled = true; btnRevert.disabled = true;
  status.textContent = '解除变身…';
  stage.classList.remove('cyborg', 'derp');
  stage.classList.add('exploding');
  setTimeout(() => {
    stage.classList.remove('exploding');
    status.textContent = '形态：Q版萌物 · 日常（刚才那个不是我）';
    btnMorph.disabled = false;
    busy = false;
  }, 900);
}
</script>

</body>
</html>
